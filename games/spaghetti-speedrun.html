function zz(a,b,cc,dd2){
 for(var n1=0;n1<P.length;n1++){
  if(a<P[n1][0]+P[n1][2]&&a+cc>P[n1][0]&&b<P[n1][1]+P[n1][3]&&b+dd2>P[n1][1]){return n1;}
 }
 for(var n3=0;n3<T.length;n3++){
  if(a<T[n3][0]+T[n3][2]&&a+cc>T[n3][0]&&b<T[n3][1]+12&&b+dd2>T[n3][1]){return 2000+n3;}
 }
 for(var n2=0;n2<M.length;n2++){
  if(a<MP[n2][0]+M[n2][2]&&a+cc>MP[n2][0]&&b<MP[n2][1]+M[n2][3]&&b+dd2>MP[n2][1]){return 1000+n2;}
 }
 return -1;
}

 for(i=0;i<S.length;i++){

 }
 for(j=0;j<E.length;j++){

 }

 for(j=0;j<CP.length;j++){ if(x>CP[j][0]&&cpx<CP[j][0]){ cpx=CP[j][0]; cpy=CP[j][1]; } }
 if(st==1&&won==0){ tm=tm+1/60; }
 if(flash>0){ flash=flash-1; }
 if(x>FIN&&y<FY){

}

function toggleFS(){
 var d=document.documentElement;
 try{
  if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  else{ var r=(d.requestFullscreen||d.webkitRequestFullscreen).call(d); if(r&&r.then){ r.then(function(){ try{navigator.keyboard.lock(['Escape']);}catch(e){} }).catch(function(){}); } }
 }catch(e){}
}
function items(){ return mn=='main'?['Играть','Обучение','Уровень '+lvn+'  ◀ ▶','Случайный уровень','Управление','Полный экран']:mn=='pause'?['Продолжить','Рестарт','Управление','Полный экран','В меню']:[]; }
function act(){
 var it=items()[sel];
 if(it=='Играть'){ loadLevel(0); mn=''; }
 else if(it=='Обучение'){ loadLevel(1); mn=''; }
 else if(it=='Продолжить'){ mn=''; }
 else if(it.indexOf('Уровень')==0){ loadLevel(2); mn=''; }
 else if(it=='Случайный уровень'){ lvn=1+Math.floor(Math.random()*999999999); loadLevel(2); mn=''; }
 else if(it=='Рестарт'){ reset(); mn=''; }
 else if(it=='Управление'){ back=mn; mn='help'; sel=0; }
 else if(it=='Полный экран'){ toggleFS(); }
 else if(it=='В меню'){ mn='main'; sel=0; }
 if(!mn){ K={}; }
}
function nav(k){
 if(k=='KeyF'){ toggleFS(); return; }
 if(k=='Escape'||k=='KeyP'){
  if(mn=='help'){ mn=back; sel=0; } else if(mn=='pause'){ mn=''; } else if(mn==''){ mn='pause'; sel=0; }
  return;
 }
 if(!mn){ play(k); return; }
 if(mn=='help'){ if(k=='Enter'||k=='Space'){ mn=back; sel=0; } return; }
 var cnt=items().length;
 if((k=='ArrowLeft'||k=='ArrowRight')&&items()[sel].indexOf('Уровень')==0){ lvn=Math.max(1,Math.min(999999999,lvn+(k=='ArrowRight'?1:-1)*(K.ShiftLeft||K.ShiftRight?1000:1))); }
 if(k=='ArrowUp'||k=='KeyW'){ sel=(sel+cnt-1)%cnt; }
 if(k=='ArrowDown'||k=='KeyS'){ sel=(sel+1)%cnt; }
 if(k=='Enter'||k=='NumpadEnter'||k=='Space'){ act(); }
}

 for(var u=0;u<it.length;u++){ if(Math.abs(px-400)<150&&Math.abs(py-(MY+u*46))<21){ return u; } }
 return -1;
}
