<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Отель «Закат»: ночная смена</title>
<style>
:root{--bg:#e6dfd2;--fg:#2b211b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a09;--fg:#eadfca}}
:root[data-theme="dark"]{--bg:#0c0a09;--fg:#eadfca}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;background:#0c0a09}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(38,22,16,.9),rgba(5,3,2,.97));color:#eadfca;overflow:auto}
.card{max-width:520px;padding:24px}
h1{margin:0 0 12px;font-size:36px;font-weight:400;letter-spacing:.03em;color:#d8b45c;text-shadow:0 0 20px rgba(216,180,92,.35)}
p{margin:0 0 12px;line-height:1.55;font-size:16px}
.ctl{font-size:14px;opacity:.8}
#en label{display:block;margin:7px 0;font-size:15px;line-height:1.4;cursor:pointer}
.bt{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{font:inherit;font-size:16px;padding:10px 16px;border:1px solid #d8b45c;background:#1a1311;color:#eadfca;border-radius:3px;cursor:pointer}
button:hover,button:focus-visible{background:#d8b45c;color:#1a1311;outline:none}
#tb{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#14100e;border-bottom:1px solid #3a2c22}
#tb button{font-size:14px;padding:6px 10px}
#tb button.on{background:#d8b45c;color:#1a1311}
#tp{position:absolute;left:8px;right:8px;top:110px;bottom:8px;display:flex;flex-direction:column;gap:8px;background:#14100e;padding:10px;border:1px solid #3a2c22}
#ta{flex:1;background:#0c0a09;color:#eadfca;font:13px/1.2 monospace;border:1px solid #3a2c22;resize:none}
#bk{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(5,3,2,.84);padding:10px;box-sizing:border-box}
.pg{width:min(580px,100%);max-height:100%;overflow:auto;box-sizing:border-box;padding:18px 24px 16px;color:#2b211b;background:#e8dcc0 repeating-linear-gradient(transparent 0 27px,rgba(90,70,40,.18) 27px 28px);border-left:14px solid #5a3a28;font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive}
.pg.blue{color:#c8ecff;background:radial-gradient(ellipse at 50% 0,#0c2440,#040a14 70%);border:1px solid #6ac4ff;border-left-width:1px;box-shadow:0 0 34px rgba(90,190,255,.45),inset 0 0 40px rgba(90,190,255,.14);font-family:Georgia,"Times New Roman",serif;text-shadow:0 0 8px rgba(120,210,255,.85)}
.pg h2{margin:10px 0 8px;font-size:26px;font-weight:400}
.pg.blue h2{color:#e6f8ff;letter-spacing:.06em}
@media (prefers-reduced-motion:no-preference){.pg.blue h2{animation:gl 3.2s ease-in-out infinite}@keyframes gl{50%{text-shadow:0 0 18px #8fdcff,0 0 36px #4aa8ff}}}
.pg p{margin:0 0 10px;font-size:17px;line-height:28px}
.pg .tc{display:flex;flex-wrap:wrap;gap:5px}
.pg button{background:transparent;color:inherit;border-color:currentColor;font-size:13px;padding:3px 8px;border-radius:2px}
.pg button:hover,.pg button:focus-visible{background:rgba(60,40,20,.16);color:inherit}
.pg.blue button:hover,.pg.blue button:focus-visible{background:rgba(120,210,255,.22)}
.pg button.on{background:rgba(60,40,20,.2);font-weight:bold}
.pg.blue button.on{background:rgba(120,210,255,.28)}
.pg.red{color:#ffd0d0;background:radial-gradient(ellipse at 50% 0,#401010,#120303 70%);border:1px solid #ff5a5a;border-left-width:1px;box-shadow:0 0 34px rgba(255,70,70,.45),inset 0 0 40px rgba(255,70,70,.14);font-family:Georgia,"Times New Roman",serif;text-shadow:0 0 8px rgba(255,90,90,.85)}
.pg.red h2{color:#ffe6e6;letter-spacing:.06em}
.pg.red button:hover,.pg.red button:focus-visible{background:rgba(255,100,100,.22)}
.pg .bkf{display:flex;align-items:center;gap:10px;margin-top:12px}
.pg .bkf span{flex:1;text-align:center;font-size:13px;opacity:.75}
.pg .bkf button{font-size:15px;padding:6px 12px}
.card.mm{text-align:center;max-width:460px;width:100%;box-sizing:border-box}
.card.mm h1{font-size:44px;line-height:1.1;margin-bottom:4px}
.card.mm .sub{font-size:13px;letter-spacing:.35em;text-transform:uppercase;opacity:.6;margin:0 0 18px}
.card.mm #tx{font-size:15px;opacity:.9}
.card.mm .rec{display:inline-block;margin:0 0 14px;padding:3px 12px;border:1px solid rgba(216,180,92,.4);font-size:13px;color:#d8b45c}
.card.mm .bt{flex-direction:column;gap:8px;margin-top:6px}
.card.mm .bt button{width:100%}
.card.mm .bt button.pri{font-size:22px;padding:14px;background:#d8b45c;color:#1a1311;letter-spacing:.05em;box-shadow:0 0 22px rgba(216,180,92,.3)}
.card.mm .bt button.pri:hover,.card.mm .bt button.pri:focus-visible{background:#f0cd78}
.card.mm .bt .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mx{margin-top:12px;text-align:left;border-top:1px solid #3a2c22;padding-top:8px}
.mx summary{cursor:pointer;font-size:15px;padding:6px 0;opacity:.85}
.mx summary:hover{opacity:1;color:#d8b45c}
.mx label{display:block;margin:7px 0;font-size:14px;line-height:1.4;cursor:pointer}
.mx p{font-size:13px;opacity:.8;margin:8px 0}
@media (prefers-reduced-motion:no-preference){.card.mm h1{animation:fl 6s steps(1) infinite}@keyframes fl{0%,91%,94%,97%,100%{opacity:1}92%,95%{opacity:.35}93%,96%{opacity:.8}}}
@media (max-width:420px){.card.mm h1{font-size:34px}.card.mm .bt .row{grid-template-columns:1fr}}
#tx{white-space:pre-line}
.off{display:none!important}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas>
<div id="tb" class="off"></div>
<div id="tp" class="off"><textarea id="ta" spellcheck="false"></textarea><div class="bt" id="tpb"></div></div>
<div id="ov"><div class="card"><h1 id="ti"></h1><p id="tx"></p><div id="en"></div><p class="ctl" id="ct"></p><div class="bt" id="bt"></div></div></div>
<div id="bk" class="off"><div class="pg" id="pg"><div class="tc" id="bkc"></div><h2 id="bkt"></h2><div id="bkx"></div><div class="bkf"><button id="bkp">← Назад</button><span id="bkn"></span><button id="bkq">Вперёд →</button><button id="bkz">Закрыть</button></div></div></div></div>
<script>
/* ===== RKCPlay: API достижений ===== */
function rkcUnlock(id){
    try{
        if(window.parent && window.parent.RKC && window.parent.RKC.unlock) window.parent.RKC.unlock(id);
        else if(window.parent && window.parent !== window)
            window.parent.postMessage({type:'rkc:ach:unlock', id:id}, '*');
    }catch(e){}
}

// ================= Настройки =================
const T=48,TIME=180,SP=165,HA=.4,RANGE=320,AMB=85,DRAIN=1/80,NOISE_AT=450;
const D=[[1,0],[-1,0],[0,1],[0,-1]];
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),dk=document.createElement('canvas'),dc=dk.getContext('2d');
let VW=0,VH=0;
function rs(){VW=cv.width=dk.width=cv.clientWidth;VH=cv.height=dk.height=cv.clientHeight}
addEventListener('resize',rs);rs();
let W,H,NF,PX,PY,map,grid,op,floors=[],test=false,TOOL='#';
let P=null,items=[],mons=[],tLeft,carried,stored,bat,walked,trail,pf,pfn,pfT,sf,lr=RANGE,S='menu',msg='',msgT=0;
const mouse={x:0,y:0},keys={};

// ================= РЕЕСТРЫ: чтобы добавить новое, достаточно новой записи =================
// Клетки: move — мешает ходить, see — мешает видеть и светить
const TILES={
 '#':{name:'⬛ Стена',move:1,see:1,col:'#4a372c'},
 'G':{name:'🟦 Стекло',move:1,see:0,col:'#5a9ab8'},
 'C':{name:'🟪 Штора',move:0,see:1,col:'#7a2e5e'},
 '.':{name:'▫️ Пол, ластик',move:0,see:0,col:'#43191d'}};
// FNAF: K — кнопка (вход), D — железная дверь (выход). Связи — провода (wires), видны только в режиме «Электрик».
TILES.K={name:'🔘 Кнопка (вход)',move:0,see:0,col:'#e0484a',btn:1,lab:'К'};
TILES.D={name:'🚪 Дверь (выход)',move:0,see:0,col:'#d8b45c',door:1,lab:'Д'};
TILES.V={name:'📹 Камера',move:0,see:0,col:'#5fd8c8',cam:1,lab:'📹'};
TILES.O={name:'🪑 Офис (режим Жёлтого)',move:0,see:0,col:'#ffd23f',lab:'О'};
TILES.l={name:'левая дверь',move:0,see:0,col:'#ffd23f',hid:1,lab:'◀'};
TILES.r={name:'правая дверь',move:0,see:0,col:'#ffd23f',hid:1,lab:'▶'};
TILES.T={name:'🖼 Картина',move:0,see:0,col:'#c89b3c',lab:'🖼'};
let tab=false,ci=0,camT=0,ds={},camBtns=[],btns=[],camList=[],wires=[],elec=false,wsel=null,angel=true,aFx=0,crosses=0,ws=[],wT=0,armed=null,cover=false,coverStamp=0,wa=0,watcherOn=false;
let fn=false,od={l:0,r:0},fcell={},flashCd=0,back=0;
const drain=()=>1+.35*Object.values(ds).filter(Boolean).length+(tab?.5:0);
// Предметы (поведение при подборе — в interact)
const ITEMS={
 F:{name:'🟨 Предохранитель',col:'#f2d34a'},
 B:{name:'🔋 Батарейка',col:'#5ec8e8'},
 X:{name:'✝ Крест',col:'#7fdcff'}};
const CROSS_R=220; // на каком расстоянии враг считается «близко» для креста
// Враги: upd — поведение, draw — вид, glow — свечение в темноте (необязательно)
const lit=m=>!tab&&m.los&&((m.d<lr&&Math.abs(angDiff(Math.atan2(m.y-P.y,m.x-P.x),P.a))<HA+.12)||m.d<45);
const dot=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()};
const ENEMIES={
 W:{name:'Бродяга',info:'заметит вас — побежит следом',col:'#d04040',
  upd(m,dt){
   const hf=hunt(m,320,3,dt);if(hf)return stepMonster(m,hf,135,dt);
   if(lureStep(m,85,dt))return;
   wander(m,70,dt);
  },
  draw(m){
   ctx.fillStyle='#1a0b0d';dot(m.x,m.y,15);
   ctx.strokeStyle='#3b1519';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(m.x-14,m.y+8);ctx.lineTo(m.x-22,m.y+18);ctx.moveTo(m.x+14,m.y+8);ctx.lineTo(m.x+22,m.y+18);ctx.stroke();
  },
  glow(m,x,y){ctx.fillStyle=m.st=='chase'?'#ff3030':'#a02020';dot(x-5,y-3,2.5);dot(x+5,y-3,2.5)}},
 S:{name:'Статуя',info:'движется, только пока на неё не светят',col:'#cfcbbd',
  upd(m,dt){m.frozen=lit(m);if(m.frozen&&m.d<45)ach('f_statue');if(!m.frozen)stepMonster(m,pf,105,dt)},
  draw(m){
   ctx.fillStyle='#b9b6ac';dot(m.x,m.y,13);ctx.fillStyle='#d5d2c8';dot(m.x,m.y-4,7);
   ctx.strokeStyle='#b9b6ac';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(m.x-11,m.y-2);ctx.lineTo(m.x-16,m.y-14);ctx.moveTo(m.x+11,m.y-2);ctx.lineTo(m.x+16,m.y-14);ctx.stroke();
  }},
 N:{name:'Шум',info:'когда вы уйдёте достаточно далеко, идёт по вашему следу с вашей скоростью и замирает, когда вы стоите',col:'#7aa6ff',
  upd(m,dt){
   if(walked<NOISE_AT||!P.mv)return;
   if(!m.joined){stepMonster(m,sf,SP,dt);if(Math.hypot(m.x-PX,m.y-PY)<3){m.joined=true;m.i=0}return}
   let b=SP*dt;
   while(b>0&&m.i<trail.length){
    const t=trail[m.i];if(grid[t[1]/T|0][t[0]/T|0])break;const dx=t[0]-m.x,dy=t[1]-m.y,d=Math.hypot(dx,dy);
    if(d<=b){m.x=t[0];m.y=t[1];b-=d;m.i++}else{m.x+=dx/d*b;m.y+=dy/d*b;b=0}
   }
  },
  draw(m){
   const cl=['#7aa6ff','#c0d0ff','#4a6ad0'];
   for(let i=0;i<3;i++){ctx.fillStyle=cl[i];ctx.fillRect(m.x-14+(Math.random()-.5)*8,m.y-15+i*10+(Math.random()-.5)*6,28,7)}
  }},
 H:{name:'Тень',info:'быстра в темноте, пятится от света',col:'#8a5ac8',
  upd(m,dt){
   if(lit(m))stepMonster(m,pfn,90,dt);
   else if(pf[(m.y/T|0)*W+(m.x/T|0)]<12)stepMonster(m,pf,150,dt);
   else if(!lureStep(m,110,dt))wander(m,60,dt);
  },
  draw(m){ctx.fillStyle='#24113a';dot(m.x,m.y,14);ctx.fillStyle='#3a1c5c';dot(m.x-6,m.y+8,6);dot(m.x+7,m.y+9,5)},
  glow(m,x,y){ctx.fillStyle='#d9b8ff';dot(x-5,y-3,2.5);dot(x+5,y-3,2.5)}},
 E:{name:'Старик',info:'мирно бродит, но если на него долго светить, звереет и нападает',col:'#b8a27a',
  upd(m,dt){
   m.anger=m.anger||0;
   if(m.st=='attack'){
    if(m.los&&m.d<360)m.lost=4;else{m.lost-=dt;if(m.lost<=0){m.st='wander';m.anger=0;m.fld=null}}
    return stepMonster(m,pf,140,dt);
   }
   m.anger=lit(m)?Math.min(1,m.anger+dt/3):Math.max(0,m.anger-dt/8);
   if(m.anger>=1){m.st='attack';m.lost=4;ach('f_angry');return}
   wander(m,55,dt);
  },
  draw(m){
   const a=m.anger||0,sx=m.x+(a>.4?(Math.random()-.5)*a*5:0),sy=m.y+(a>.4?(Math.random()-.5)*a*5:0);
   ctx.fillStyle='rgb('+(184+a*30|0)+','+(162-a*120|0)+','+(122-a*90|0)+')';dot(sx,sy,13);
   ctx.fillStyle='#e8e0d0';dot(sx,sy-8,6);
   ctx.strokeStyle='#5a4326';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx+13,sy-2);ctx.lineTo(sx+17,sy+16);ctx.stroke();
  },
  glow(m,x,y){if(m.st=='attack'){ctx.fillStyle='#ff3030';dot(x-4,y-8,2.5);dot(x+4,y-8,2.5)}}},
 L:{name:'Флод',info:'как Бродяга, но видит ближе; иногда игра выдаёт ему ваши координаты на одну секунду, и он идёт в эту точку',col:'#2ac0b0',
  upd(m,dt){
   m.pt=(m.pt==null?rnd(4,9):m.pt)-dt;m.warn=m.pt<.9&&m.pt>0;
   if(m.pt<=0){m.pt=rnd(8,15);m.warn=false;m.st='ping';m.tc=[P.x/T|0,P.y/T|0];m.fld=field(m.tc[0],m.tc[1]);m.t=null;m.lost=7}
   const hf=hunt(m,200,3,dt);if(hf)return stepMonster(m,hf,125,dt);
   if(lureStep(m,85,dt))return;
   if(m.st=='ping'){
    m.lost-=dt;if(!m.fld)m.fld=field(m.tc[0],m.tc[1]);
    if(m.fld[(m.y/T|0)*W+(m.x/T|0)]==0||m.lost<=0){m.st='wander';m.fld=null;return}
    return stepMonster(m,m.fld,125,dt);
   }
   wander(m,65,dt);
  },
  draw(m){
   ctx.fillStyle='#0d3a44';dot(m.x,m.y,14);ctx.fillStyle='#14566a';dot(m.x-6,m.y+7,6);dot(m.x+7,m.y+9,5);
   ctx.fillStyle='#2a8aa0';for(const dx of [-7,0,7])ctx.fillRect(m.x+dx,m.y+13,2,5+Math.random()*4);
  },
  glow(m,x,y){ctx.fillStyle=m.st=='chase'||m.st=='ping'?'#7fffee':'#2ac0b0';dot(x-5,y-3,2.5);dot(x+5,y-3,2.5)}},
 Z:{name:'Зритель',nospawn:1,info:'безвреден и не имеет точки появления: мелькает в луче, у штор и дверей, встаёт за спиной, ходит вдоль стекла, машет из-за него, заглядывает в камеры',col:'#e6e3d8',upd(){},draw(){}}
};
// видит вас — бежит напрямую; потерял из виду — идёт в последнюю замеченную точку и успокаивается
function hunt(m,rng,mem,dt){
 if(m.los&&m.d<rng){
  m.st='chase';m.lost=mem;const k=(P.x/T|0)+','+(P.y/T|0);
  if(m.seenK!=k){m.seenK=k;m.seen=[P.x/T|0,P.y/T|0];m.sfld=null}
  return pf;
 }
 if(m.st!='chase')return null;
 m.lost-=dt;if(!m.sfld)m.sfld=field(m.seen[0],m.seen[1]);
 if(m.lost<=0||m.sfld[(m.y/T|0)*W+(m.x/T|0)]==0){m.st='wander';m.fld=null;m.sfld=null;m.seenK=null;return null}
 return m.sfld;
}
function wander(m,sp,dt){
 if(!m.fld||m.fld[(m.y/T|0)*W+(m.x/T|0)]==0){
  let c,n=0;
  if(Math.random()<.3){
   const nr=floors.filter(f=>{const d=Math.hypot(f[0]*T-P.x,f[1]*T-P.y);return d>T*5&&d<T*12});
   if(nr.length)c=nr[Math.random()*nr.length|0];
  }
  if(!c)do{c=floors[Math.random()*floors.length|0]}while(++n<30&&Math.hypot(c[0]*T-m.x,c[1]*T-m.y)<T*4);
  m.fld=field(c[0],c[1]);
 }
 stepMonster(m,m.fld,sp,dt);
}
ENEMIES.R={name:'Доходяга',fnonly:1,info:'только у Жёлтого: тихо бредёт к правой двери офиса',col:'#9bb08a',upd(m,dt){if(fn)fnAI(m,dt)},
 draw(m){ctx.strokeStyle='#9bb08a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(m.x,m.y-16);ctx.lineTo(m.x,m.y+8);ctx.moveTo(m.x-10,m.y-6);ctx.lineTo(m.x+10,m.y-6);ctx.moveTo(m.x,m.y+8);ctx.lineTo(m.x-7,m.y+20);ctx.moveTo(m.x,m.y+8);ctx.lineTo(m.x+7,m.y+20);ctx.stroke();ctx.fillStyle='#b8c8a8';dot(m.x,m.y-20,6)},
 glow(m,x,y){ctx.fillStyle='#d0ffb0';dot(x-3,y-21,1.8);dot(x+3,y-21,1.8)}};
ENEMIES.A={name:'Художник',info:'медленно гонится; телепортируется через картины ближе к вам. У Жёлтого лезет в картину на камере: ослепите вспышкой',col:'#e0a040',
 upd(m,dt){
  m.cd=m.cd==null?rnd(8,14):m.cd;
  if(m.tp>0){m.tp-=dt;if(m.tp<=0){const ps=find('T').filter(([x,y])=>Math.hypot(x*T-P.x,y*T-P.y)>T*4).sort((a,b)=>Math.hypot(a[0]*T-P.x,a[1]*T-P.y)-Math.hypot(b[0]*T-P.x,b[1]*T-P.y));if(ps.length){m.x=ps[0][0]*T+T/2;m.y=ps[0][1]*T+T/2;m.t=null;m.fld=null;m.st='wander'}m.cd=rnd(14,22)}return}
  m.cd-=dt;const hf=hunt(m,300,3,dt);
  if(m.cd<=0&&find('T').length){m.tp=3;m.t=null;return}
  if(hf)return stepMonster(m,hf,115,dt);
  if(lureStep(m,70,dt))return;
  wander(m,60,dt);
 },
 draw(m){ctx.fillStyle='#3a2a1a';dot(m.x,m.y,14);ctx.fillStyle='#e0a040';ctx.fillRect(m.x-9,m.y-22,18,6);ctx.fillStyle='#c0392b';dot(m.x+9,m.y+4,4);
  if(m.tp>0){ctx.strokeStyle='rgba(224,160,64,'+(.4+.4*Math.sin(performance.now()/90))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(m.x,m.y,18+(5-m.tp)*5,0,7);ctx.stroke()}},

const hard=(x,y)=>grid[y/T|0][x/T|0], solid=(x,y)=>op[y/T|0][x/T|0];

function move(dx,dy){if(okAt(P.x+dx,P.y))P.x+=dx;if(okAt(P.x,P.y+dy))P.y+=dy}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function LOS(a,b,c,d){const n=Math.hypot(c-a,d-b)/8|0;for(let i=1;i<n;i++)if(solid(a+(c-a)*i/n,b+(d-b)*i/n))return false;return true}
function field(tx,ty){
 const f=new Int16Array(W*H).fill(9999),q=[tx+ty*W];f[q[0]]=0;
 for(let i=0;i<q.length;i++){
  const c=q[i],x=c%W,y=c/W|0;
  for(const [a,b] of D){const nx=x+a,ny=y+b;if(!grid[ny][nx]&&f[ny*W+nx]==9999){f[ny*W+nx]=f[c]+1;q.push(ny*W+nx)}}
 }
 return f;
}
function stepMonster(m,f,sp,dt){
 if(m.t&&grid[m.t.y/T|0][m.t.x/T|0])m.t=null;
 if(!m.t||Math.hypot(m.t.x-m.x,m.t.y-m.y)<2){
  const cx=m.x/T|0,cy=m.y/T|0;let best=null,bd=f[cy*W+cx];
  for(const [a,b] of D){const nx=cx+a,ny=cy+b;if(grid[ny][nx])continue;const v=f[ny*W+nx];if(v<bd){bd=v;best=[nx,ny]}}
  m.t=best?{x:best[0]*T+T/2,y:best[1]*T+T/2}:null;
 }
 if(m.t){const dx=m.t.x-m.x,dy=m.t.y-m.y,d=Math.hypot(dx,dy)||1,s=Math.min(d,sp*dt);m.x+=dx/d*s;m.y+=dy/d*s}
}

{t:'Красный свет',red:1,h:['Красный свет','Снейк'],p:[
`Ты читаешь не то, что писал электрик. Это я, красный свет. Голубой любит повторять, что он твой друг. Он был моим братом, пока не выбрал людей.
Отель строили для нас двоих. Он дал нам стены, коридоры и тишину, а мы дали ему голос. С тех пор мы с отелем договорились: время идёт в одну сторону, и мы за ним следим. Монстры не злые, они голодные, а я их кормлю. Каждая лампа, что мигнула красным, значит, что кто-то сделал шаг.`,
`Когда ты не успеваешь, отель закрывает двери и зовёт меня. Приходит Снейк. Он не ходит по коридорам, ему не нужны стены. Он летит прямо к тебе, и всё, что ты принёс, перестаёт работать.

{t:'Бродяга',p:[
`Он ходит по коридорам и ищет свою комнату. Когда-то у него был ключ, а теперь только красные глаза. Ходит он медленно и не спешит.

`Как я с ним живу. Бегу я быстрее, чем он. Если вижу, что он идёт за мной, не паникую, а ухожу за угол или шторой отрезаю взгляд.

{t:'Статуя',p:[
`Гипсовая, белая, с протянутыми руками. Стояла в холле, теперь стоит не там, где я её оставил. Пока на неё падает свет, она замирает. Стоит повернуть луч, она делает шаг, потом ещё один.

`Правило простое: пока смотрю на неё, она не двигается. Но смотреть я могу только в одну сторону. Идти приходится спиной вперёд, держа луч на ней.
Планшет не помогает: пока я смотрю в экран, свет моего фонарика на неё не падает. Она подходит вплотную, и я узнаю об этом уже поздно.`]},
{t:'Шум',p:[
`Это не шаги, а синее шипение, как телевизор после конца передач. Он не появляется сразу: когда я отхожу от входа достаточно далеко, шум вспоминает про меня и идёт по моему следу, туда, где я ходил.
Скорость у него моя, ни быстрее, ни медленнее. Вспышки синего, как сломанные пиксели.`,
`Я заметил, что шум идёт, только пока иду я. Остановился, и он тоже остановился, как будто боится выдать себя. Если нужно выиграть время, я стою и считаю про себя.

{t:'Тень',p:[
`Она живёт там, где выключили лампы. В темноте движется быстро, быстрее всех здесь, и глаза у неё светятся фиолетовым.
Но свет она не любит: когда на неё падает луч, она пятится назад. Тени остались от тех, кто ушёл из отеля вместе со светом и забыл их у выключателей.`,
`С ней я рассчитываюсь батарейками. Пока луч яркий, она держится на расстоянии. Но фонарик слабеет, луч сужается, и она подходит ближе. Каждую найденную батарейку я встречаю как друга.
Когда заряд почти на нуле, я стараюсь держаться комнат, где можно закрыть дверь. В темноте она рядом очень быстро.`]},
{t:'Старик',p:[
`Самый старый постоялец «Заката». Ходит с тростью, медленно, никого не трогает и, кажется, давно забыл, что он здесь не хозяин.
Одного он не терпит: когда ему светят в лицо. Если держать луч на нём несколько секунд, глаза краснеют, плечи дрожат, и он бросается следом.`,
`Я уяснил главное: не светить на него без нужды. Можно пройти мимо, если держать луч в сторону.

{t:'Флод',p:[
`Он похож на Бродягу, но слепее: замечает меня не дальше пяти шагов. Зато у него есть то, чего нет у Бродяги. Иногда отель шепчет ему, где я стою, и он идёт туда.

`Перед тем как отель подсказывает ему мои координаты, лампы мигают и на экране идёт рябь. Я научился считать эту секунду. Как только мигнуло, ухожу с того места, где стоял, и он приходит в пустоту.

{t:'Зритель',p:[
`Он не нападает. Я проверял: стоял перед ним, пока он не исчез. Он появляется на миг: в луче фонарика, когда я резко его поворачиваю; за стеклом, смотрит в комнату; у шторы, и тогда уходит в неё, или выходит оттуда и проскальзывает перед самым моим носом.
Высокий, чёрный, с белым лицом без выражения. У него нет своей комнаты и нет места, где он живёт: он просто оказывается рядом.`,
`На камерах он тоже есть. Иногда мелькнёт в углу кадра, а иногда закроет собой весь экран, и пока я не переключу камеру, я ничего не вижу. Это самое неприятное: он молчит, а я не знаю, что делается за ним.
Привыкать к нему нельзя. Он ничего не делает, и от этого только хуже. Самое разумное не отвлекаться от дела: ему нужно только, чтобы я посмотрел.`,
`Он любит стекло. Стоит за ним и смотрит. Один раз помахал мне рукой, я помахал в ответ, а он исчез: наверное, смутился. Бывает, прижимается к стеклу так, что лицо становится больше головы. Шаг к нему, и его уже нет.
Ещё он умеет ходить вдоль стены по ту сторону, ровно в мой шаг. Я иду, он идёт. Я встал, он встал. Но стоит мне обойти стену и оказаться на его стороне, там пусто, как будто я выключил лампу в комнате.`,
`Расписания у него нет. Иногда он оказывается за спиной, и я вижу только два белых огонька в темноте. Стоит повернуть луч туда, и он пропадает, как будто прячется, пока я не смотрю.
Выглядывает из открытых дверей и из-за штор. А на камерах заглядывает в угол кадра, как человек, который боится, что его сфотографируют. Переключил камеру, и он ушёл. Я уже почти не вздрагиваю.`]},
{t:'Камеры',p:[
`Камеры поставили после той ночи, когда отель закрылся. Над дверями, в углах, с красным огоньком.
Планшет открывается на Q: зелёная картинка с помехами, на ней коридор и всё, что в нём движется. Переключать камеры можно клавишами A и D, стрелками, цифрами или кнопками внизу экрана.`,
`Цена планшета высока. Пока я смотрю в экран, я стою на месте и не вижу своего света. Статуя в это время идёт ко мне, Тень не боится, а Старик не злится, потому что луча нет. Батарейка тоже садится быстрее.
Если враг подошёл совсем близко, экран краснеет, и это единственное предупреждение, которое у меня есть. Камеры не видят сквозь закрытую дверь и шторы.`,
`Планшет оказался не только глазами, но и громкоговорителем. Если нажать E, камера издаёт резкий звук со вспышкой, и всё, что слышит, идёт к ней. Бродяга, Флод и Тень слышат. Статуя, Шум и Старик глухи, а Зрителю всё равно.
Работает не всегда: кто уже гонится за мной, того звук не отвлекает. Закрытая дверь глушит шум, так что звать лучше из-за двери. После вспышки камера остывает несколько секунд.`]},
{t:'Электричество',p:[
`Предохранители лежат по комнатам. Беру их по одному или несколько сразу. Несу к щитку у входа и вставляю левой кнопкой, когда подхожу вплотную.
Когда последний встанет на место, свет включится, двери откроются, и отель меня отпустит. Батарейки подзаряжают фонарик, но заряд расходуется всегда, а не только когда светит.`,
`Железные двери открываются кнопками. Кнопка соединена с дверью проводом, и по привычке я вижу эти провода через стены своим трассоискателем. Это и есть режим электрика: линии появляются только в нём и пропадают, когда я его выключаю.
Одна кнопка может запирать сразу несколько дверей. Но каждая закрытая дверь тянет ток, и фонарик гаснет быстрее. Если в проёме кто-то стоит, дверь не закроется.`]}
];

const rnd=(a,b)=>a+Math.random()*(b-a);
const freeAt=(x,y)=>{const gy=y/T|0,gx=x/T|0;return grid[gy]!==undefined&&grid[gy][gx]===0&&op[gy][gx]===0};
const nbFloor=(cx,cy)=>D.map(([a,b])=>[cx+a,cy+b]).filter(([x,y])=>grid[y]&&grid[y][x]===0&&op[y][x]===0);
function pickTile(ch,min,max){
 const c=find(ch).map(([x,y])=>[x,y,Math.hypot(x*T+T/2-P.x,y*T+T/2-P.y)]).filter(q=>q[2]>min&&q[2]<max).sort(()=>Math.random()-.5);
 for(const [x,y] of c){const n=nbFloor(x,y).filter(([a,b])=>LOS(P.x,P.y,a*T+T/2,b*T+T/2));if(n.length)return{x,y,n:n[Math.random()*n.length|0]}}
 return null;
}
const SPAWN={
 turn(){
  for(let i=0;i<14;i++){const a=P.a+rnd(-.25,.25),d=rnd(130,260),x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
   if(freeAt(x,y)&&LOS(P.x,P.y,x,y)){ws.push({kind:'flash',x,y,t:0,life:rnd(.25,.5)});return true}}
  return false;
 },
 cin(){
  const q=pickTile('C',90,400);if(!q)return false;
  const ax=q.n[0]*T+T/2,ay=q.n[1]*T+T/2;ws.push({kind:'cin',x:ax,y:ay,ax,ay,cx:q.x*T+T/2,cy:q.y*T+T/2,t:0,life:1.9});return true;
 },
 cout(){
  const q=pickTile('C',100,420);if(!q)return false;
  const sx=q.x*T+T/2,sy=q.y*T+T/2,tx=P.x+Math.cos(P.a)*90,ty=P.y+Math.sin(P.a)*90,d=Math.hypot(tx-sx,ty-sy);
  if(d<60)return false;
  ws.push({kind:'cout',x:sx,y:sy,vx:(tx-sx)/d*300,vy:(ty-sy)/d*300,t:0,life:Math.min(2.2,(d+220)/300)});return true;
 },
 glass(v){
  const q=pickTile('G',100,420);if(!q)return false;
  ws.push({kind:'glass',v,x:q.x*T+T/2,y:q.y*T+T/2,t:0,life:v=='press'?rnd(2,3.5):v=='wave'?rnd(2,3.2):rnd(1.4,2.6)});return true;
 },
 gwave(){return SPAWN.glass('wave')},
 gpress(){return SPAWN.glass('press')},
 gwalk(){
  const free=(x,y)=>grid[y]&&grid[y][x]===0;
  const c=find('G').map(([x,y])=>({x,y,a:x*T+T/2,b:y*T+T/2})).filter(q=>{const d=Math.hypot(q.a-P.x,q.b-P.y);return d>60&&d<230}).sort(()=>Math.random()-.5);
  for(const q of c){
   const ax=free(q.x,q.y-1)&&free(q.x,q.y+1)?'v':free(q.x-1,q.y)&&free(q.x+1,q.y)?'h':null;
   if(!ax||!LOS(P.x,P.y,q.a,q.b))continue;
   const s=ax=='v'?Math.sign(P.y-q.b):Math.sign(P.x-q.a);if(!s)continue;
   ws.push({kind:'gwalk',ax,s,gx:q.a,gy:q.b,x:q.a,y:q.b,t:0,life:rnd(5,8),hid:true});return true;
  }
  return false;
 },
 back(){
  for(let i=0;i<14;i++){const a=P.a+Math.PI+rnd(-.5,.5),d=rnd(110,220),x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
   if(freeAt(x,y)&&LOS(P.x,P.y,x,y)){ws.push({kind:'back',x,y,t:0,life:rnd(4,7)});return true}}
  return false;
 },
 dpeek(){
  const q=pickTile('D',110,420);if(!q||ds[dkey(q.x,q.y)])return false;
  ws.push({kind:'dpeek',x:q.x*T+T/2,y:q.y*T+T/2,t:0,life:rnd(1.2,2)});return true;
 },
 cedge(){
  ws.push({kind:'cedge',x:-9999,y:-9999,t:0,life:rnd(1.3,2.4),cx:camT,sx:Math.random()<.5?-1:1,sy:Math.random()<.5?-1:1});return true;
 },
 cam(){
  if(Math.random()<.45){cover=true;coverStamp=camT;return true}
  const c=camList[(ci%camList.length+camList.length)%camList.length],X=c[0]*T+T/2,Y=c[1]*T+T/2;
  for(let i=0;i<14;i++){const a=rnd(0,6.28),d=rnd(70,230),x=X+Math.cos(a)*d,y=Y+Math.sin(a)*d;
   if(freeAt(x,y)&&LOS(X,Y,x,y)){ws.push({kind:'cam',x,y,t:0,life:rnd(.5,1.1)});return true}}
  return false;
 }
};
const nextW=short=>{wT=short||Math.random()<.25?rnd(1.5,4):rnd(8,22)};
function watcherTick(dt){
 for(const w of ws){
  w.t+=dt;
  if(w.kind=='cin'&&w.t>1.4){const k=Math.min(1,(w.t-1.4)/.45);w.x=w.ax+(w.cx-w.ax)*k;w.y=w.ay+(w.cy-w.ay)*k}
  else if(w.kind=='cout'){w.x+=w.vx*dt;w.y+=w.vy*dt}
  else if(w.kind=='gwalk')gwalkStep(w);
  else if(w.kind=='back'&&!tab&&Math.abs(angDiff(Math.atan2(w.y-P.y,w.x-P.x),P.a))<.4)w.t=w.life;
  else if(w.kind=='cedge'&&camT!=w.cx)w.t=w.life;
  else if(w.v=='press'&&Math.hypot(w.x-P.x,w.y-P.y)<90)w.t=w.life;
 }
 ws=ws.filter(w=>w.t<w.life);
 const da=Math.abs(angDiff(P.a,wa));wa=P.a;
 if(!watcherOn)return;
 if(armed){
  armed.t-=dt;
  if(tab||armed.t<=0){armed=null;nextW(true)}
  else if(da/dt>3&&SPAWN.turn()){armed=null;nextW()}
  return;
 }
 wT-=dt;if(wT>0)return;
 const list=(tab?(camList.length?['cam','cedge']:[]):['turn','cin','cout','glass','gwave','gpress','gwalk','back','dpeek']).sort(()=>Math.random()-.5);
 for(const k of list){
  if(k=='turn'){armed={t:10};return}
  if(SPAWN[k]()){nextW();return}
 }
 nextW(true);
}
function gwalkStep(w){
 const s=w.ax=='v'?Math.sign(P.y-w.gy):Math.sign(P.x-w.gx);
 if(s!=w.s||Math.hypot(P.x-w.gx,P.y-w.gy)>340){w.t=w.life;return}
 if(w.ax=='v'){w.x=Math.max(w.gx-T*2.2,Math.min(w.gx+T*2.2,P.x));w.y=w.gy-w.s*T*.75}
 else{w.y=Math.max(w.gy-T*2.2,Math.min(w.gy+T*2.2,P.y));w.x=w.gx-w.s*T*.75}
 w.hid=!freeAt(w.x,w.y);
 if(!w.hid&&Math.hypot(w.x-P.x,w.y-P.y)<40)w.t=w.life;
}

 ctx.strokeStyle='#07070b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-11,22);ctx.moveTo(8,0);ctx.lineTo(11,22);ctx.stroke();

 if(w.v=='wave'){const a=Math.sin(w.t*9)*7;ctx.strokeStyle='#07070b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(8,-2);ctx.lineTo(17,-14);ctx.lineTo(17+a,-26);ctx.stroke();ctx.fillStyle='#e6e3d8';dot(17+a,-27,3)}
 ctx.restore();
 const gt=w.kind=='glass'?[w.x,w.y]:w.kind=='gwalk'?[w.gx,w.gy]:null;
 if(gt){const gx=(gt[0]/T|0)*T,gy=(gt[1]/T|0)*T;ctx.fillStyle='rgba(120,190,220,.34)';ctx.fillRect(gx,gy,T,T);ctx.strokeStyle='rgba(230,248,255,.65)';ctx.lineWidth=2;ctx.strokeRect(gx+2,gy+2,T-4,T-4)}
}

 for(const e of ws)if(e.kind=='cedge'){

  ctx.fillStyle='#d9d7cc';ctx.beginPath();ctx.ellipse(px,py,fr*.8,fr*1.15,e.sx*e.sy*.35,0,7);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(px-fr*.28,py-fr*.25,fr*.13,fr*.28,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(px+fr*.28,py-fr*.25,fr*.13,fr*.28,0,0,7);ctx.fill();
 }
 if(lureFx>0){

  ctx.fillStyle='rgba(255,255,255,'+Math.max(0,.55*(1-k*3))+')';ctx.fillRect(x0,y0,w,h);
 }
 ctx.fillStyle='rgba(30,150,70,.3)';ctx.fillRect(x0,y0,w,h);
 ctx.fillStyle='rgba(0,0,0,.2)';for(let y=y0;y<y0+h;y+=4)ctx.fillRect(x0,y,w,1);
 ctx.fillStyle='rgba(200,255,210,.12)';for(let i=sw?70:5;i--;)ctx.fillRect(x0+Math.random()*w,y0+Math.random()*h,20+Math.random()*90,1+Math.random()*2);
  if(sw){ctx.fillStyle='rgba(190,255,200,.28)';ctx.fillRect(x0,y0,w,h)}
  {const k=Math.min(130/W,100/H),a=x0+8,b=y0+8;ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(a-3,b-3,W*k+6,H*k+6);ctx.fillStyle='#2a7a45';
   for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(map[y][x]=='#')ctx.fillRect(a+x*k,b+y*k,k+.5,k+.5);
   camList.forEach(([x,y],i)=>{ctx.fillStyle=i==ci?'#fff':'#6fe58a';ctx.beginPath();ctx.arc(a+(x+.5)*k,b+(y+.5)*k,i==ci?Math.max(3,k):2,0,7);ctx.fill()});
   if(fn){ctx.fillStyle='#ffd23f';ctx.fillRect(a+(PX/T-.5)*k,b+(PY/T-.5)*k,Math.max(3,k),Math.max(3,k))}

 ctx.restore();
 ctx.strokeStyle='#2aa84f';ctx.lineWidth=2;ctx.strokeRect(x0,y0,w,h);
 ctx.fillStyle=g;ctx.textAlign='left';ctx.fillText('КАМ '+(ci+1)+'/'+camList.length,x0,38);
 ctx.textAlign='center';const tl=Math.max(0,Math.ceil(tLeft));ctx.fillText((tl/60|0)+':'+String(tl%60).padStart(2,'0'),VW/2,38);
 ctx.textAlign='right';if(Math.sin(tm/450)>0){ctx.fillStyle='#ff4040';dot(VW-mg-58,32,5)}ctx.fillStyle=g;ctx.fillText('ЗАП',VW-mg,38);
 const bw=46,bh=34,tw=camList.length*(bw+8)-8;ctx.textAlign='center';
 camList.forEach((c,i)=>{const bx=(VW-tw)/2+i*(bw+8),by=y0+h+12;camBtns.push({x:bx,y:by,w:bw,h:bh,i});
  ctx.fillStyle=i==ci?g:'#0a1c10';ctx.fillRect(bx,by,bw,bh);ctx.strokeStyle='#2aa84f';ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle=i==ci?'#031':g;ctx.fillText(String(i+1),bx+bw/2,by+23)});
 ctx.font='13px monospace';ctx.fillStyle=g;ctx.fillText((fn?'A/D — камера · W — дверь · E — вспышка'+(flashCd>0?' ('+Math.ceil(flashCd)+' с)':'')+' · Q — закрыть':'A/D — камера · 1–9 — выбор · E — приманка'+(lureCd>0?' ('+Math.ceil(lureCd)+' с)':'')+' · Q — закрыть'),VW/2,VH-10);
 glitchFx();
  if(msgT>0){ctx.fillStyle='#ffd23f';ctx.fillText(msg,VW/2,VH-54)}
  let dg=0;for(const m of mons)dg=Math.max(dg,1-(m.d||999)/220);

// ================= Редактор карты =================
const TOOLS=[...Object.entries(TILES).filter(([k,v])=>!v.hid).sort((a,b)=>(a[0]>='0'&&a[0]<='9')-(b[0]>='0'&&b[0]<='9')).map(([k,v])=>[k,v.name]),['P','🟩 Старт и щиток'],...Object.entries(ITEMS).map(([k,v])=>[k,v.name]),...Object.entries(ENEMIES).filter(([k,v])=>!v.nospawn).map(([k,v])=>[k,'👾 '+v.name])];
const tb=$('tb'),tp=$('tp'),ta=$('ta'),tpb=$('tpb');
const mb=btn(tb,'🔌 Режим: строительство',()=>{
 elec=!elec;wsel=null;mb.textContent=elec?'🔨 Режим: электрик':'🔌 Режим: строительство';
 tb.querySelectorAll('.tl').forEach(b=>b.classList.toggle('off',elec));
 say(elec?'Нажмите кнопку, затем дверь: между ними пройдёт провод. Повторное соединение удаляет провод.':'');msgT=6;
});
TOOLS.forEach(([k,t])=>{const b=btn(tb,t,()=>{TOOL=k;tb.querySelectorAll('button').forEach(c=>c.classList.remove('on'));b.classList.add('on')});b.classList.add('tl');if(k==TOOL)b.classList.add('on')});
btn(tb,'▶ Проверить',()=>{const e=check();e?say(e):start(true)});
btn(tb,'📋 Текст карты',()=>{ta.value=mapText();tp.style.top=tb.offsetHeight+8+'px';tp.classList.remove('off')});
function resizeMap(side,n){
 const a=Math.abs(n),hz=side=='l'||side=='r';
 if(n>0&&(hz?W+a>80:H+a>60))return say('Карта уже максимального размера.');
 if(n<0&&(hz?W-a<9:H-a<9))return say('Карта не может быть меньше 9 клеток.');
 if(hz)map.forEach((r,y)=>{const i=side=='r'?W-1:1;n>0?r.splice(i,0,...Array(a).fill(y==0||y==H-1?'#':'.')):r.splice(side=='r'?W-1-a:1,a)});
 else if(n>0)map.splice(side=='b'?H-1:1,0,...Array.from({length:a},()=>map[0].map((_,x)=>x==0||x==W-1?'#':'.')));
 else map.splice(side=='b'?H-1-a:1,a);
 if(side=='l')wires.forEach(w=>{w.b[0]+=n;w.d[0]+=n});
 if(side=='t')wires.forEach(w=>{w.b[1]+=n;w.d[1]+=n});
 W=map[0].length;H=map.length;sync();save();ach('b_size');say('Размер карты: '+W+'×'+H);
}
for(const [t,s2,n] of [['Шире →','r',5],['← Шире','l',5],['Выше ↑','t',5],['Ниже ↓','b',5],['Уже →','r',-5],['← Уже','l',-5],['Ниже ↓ −','b',-5],['Выше ↑ −','t',-5]])btn(tb,t,()=>resizeMap(s2,n));
btn(tb,'🗺 Карты',()=>{tb.classList.add('off');tp.classList.add('off');openMaps()});
btn(tb,'↺ Стандартная',()=>{applyMap(DEFAULT_MAP);save()});
btn(tb,'← Меню',()=>{tb.classList.add('off');tp.classList.add('off');menu()});
btn(tpb,'Применить',()=>{const r=ta.value.split('\n').filter(s=>s.trim());if(r.length<5)return say('Слишком мало строк.');applyMap(r);save();tp.classList.add('off')});
btn(tpb,'Закрыть',()=>tp.classList.add('off'));
function openEditor(err){
 S='edit';P=null;test=false;$('ov').classList.add('off');tb.classList.remove('off');
 if(err)say(err);
}
let es=1,eox=0,eoy=0,painting=false;
function drawEdit(){
 eoy=tb.offsetHeight+8;
 es=Math.max(8,Math.floor(Math.min(VW/W,(VH-eoy-30)/H)));eox=(VW-es*W)/2|0;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const c=map[y][x],X=eox+x*es,Y=eoy+y*es;
  ctx.fillStyle=TILES[c]&&c!='.'?TILES[c].col:(x+y)%2?'#4a1c20':'#43191d';ctx.fillRect(X,Y,es,es);
  const col=c=='P'?'#5fd37a':ITEMS[c]?ITEMS[c].col:ENEMIES[c]?ENEMIES[c].col:null;
  if(col){ctx.fillStyle=col;dot(X+es/2,Y+es/2,es*.32)}
  if(TILES[c]&&TILES[c].lab&&es>=14){ctx.fillStyle='#000';ctx.textAlign='center';ctx.font='bold '+(es*.45|0)+'px Georgia';ctx.fillText(TILES[c].lab,X+es/2,Y+es*.66)}
 }
 if(elec){
  ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(eox,eoy,es*W,es*H);
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;
  for(const w of wires){ctx.beginPath();ctx.moveTo(eox+(w.b[0]+.5)*es,eoy+(w.b[1]+.5)*es);ctx.lineTo(eox+(w.d[0]+.5)*es,eoy+(w.d[1]+.5)*es);ctx.stroke()}
  ctx.textAlign='center';ctx.font='bold '+(es*.5|0)+'px Georgia';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=map[y][x];if(c=='K'||c=='D'){const X=eox+x*es,Y=eoy+y*es;ctx.fillStyle=TILES[c].col;ctx.fillRect(X+1,Y+1,es-2,es-2);ctx.fillStyle='#000';ctx.fillText(TILES[c].lab,X+es/2,Y+es*.7)}}
  if(wsel){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(eox+wsel[0]*es,eoy+wsel[1]*es,es,es)}
 }
 ctx.textAlign='center';ctx.font='16px Georgia';ctx.fillStyle='#d8b45c';
 ctx.fillText(msgT>0?msg:'Рисуйте мышью. Кнопки и двери соединяются проводами в режиме электрика. Края карты — стены.',VW/2,VH-10);
}
function wireClick(x,y){
 const c=map[y][x];msgT=4;
 if(c!='K'&&c!='D'){wsel=null;return say('Выберите кнопку (вход) или дверь (выход)')}
 if(!wsel){wsel=[x,y];return say(c=='K'?'Вход выбран. Теперь нажмите на дверь':'Выход выбран. Теперь нажмите на кнопку')}
 const a=map[wsel[1]][wsel[0]],o=wsel;wsel=null;
 if(o[0]==x&&o[1]==y)return say('Выбор отменён');
 if(a==c)return say(c=='K'?'Вход с входом соединить нельзя':'Выход с выходом соединить нельзя');
 const b=a=='K'?o:[x,y],d=a=='K'?[x,y]:o,k=wires.findIndex(w=>w.b+''==b+''&&w.d+''==d+'');
 if(k>=0){wires.splice(k,1);say('Провод удалён')}else{wires.push({b,d});ach('b_wire');say('Провод проложен')}

}
function paint(e){
 if(S!='edit')return;
 const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-eox)/es),y=Math.floor((e.clientY-r.top-eoy)/es);
 if(x<1||y<1||x>=W-1||y>=H-1)return;
 if(elec){if(e.type=='mousedown')wireClick(x,y);return}
 if(TOOL=='O'){if(x<3||y<3||x>W-4||y>H-4)return say('Офис нужен подальше от края');for(const c of 'Olr')find(c).forEach(([a,b])=>map[b][a]='.');for(let a=-1;a<=1;a++){map[y-1][x+a]='#';map[y+1][x+a]='#'}map[y][x-1]='l';map[y][x]='O';map[y][x+1]='r';sync();save();return say('Офис поставлен: включён режим Жёлтого')}
 if(TOOL=='P')find('P').forEach(([a,b])=>map[b][a]='.');
 if(map[y][x]!=TOOL){map[y][x]=TOOL;sync();save();ach('b_paint');if(TOOL=='V')ach('b_cam')}
}

// ================= Ввод и цикл =================
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(S=='play'&&!book)upd(dt);else if(msgT>0)msgT-=dt;
 draw();if(S=='play'&&back>0){ctx.fillStyle='rgba(150,0,0,'+(.3+.2*Math.sin(now/60))+')';ctx.fillRect(0,0,VW,VH);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 28px Georgia';ctx.fillText('ОН У ВАС ЗА СПИНОЙ',VW/2,VH/2)}requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{keys[e.code]=true;
 if(book){
  if(e.code=='Escape'||e.code=='KeyN')closeBook();
  else if(e.code=='ArrowRight'||e.code=='KeyD')flip(1);
  else if(e.code=='ArrowLeft'||e.code=='KeyA')flip(-1);
  if(e.code.startsWith('Arrow'))e.preventDefault();
  return;
 }
 if(e.code=='KeyN'&&!e.repeat&&(S=='menu'||S=='play')){openBook();return}
 if(S=='play'){
  const sc=()=>{camT=performance.now()};
  if(e.code=='KeyQ'){if(!e.repeat&&!ot){tab=!tab;sc();if(tab&&S=='play'){rdTab=true;ach('c_first')}}}
  else if(e.code=='KeyE'&&!e.repeat)tab?(fn?flash():useLure()):(fn||useCross());
   else if(fn&&!tab&&!e.repeat&&(e.code=='KeyA'||e.code=='KeyD'))odToggle(e.code=='KeyA'?'l':'r');
  else if(tab){
   if(e.code=='Escape')tab=false;if(fn&&e.code=='KeyW'&&!e.repeat)camDoor();
   if(e.code=='ArrowRight'||e.code=='KeyD'){ci++;sc()}
   if(e.code=='ArrowLeft'||e.code=='KeyA'){ci--;sc()}
   if(/^Digit[1-9]$/.test(e.code)&&+e.code.slice(5)<=camList.length){ci=+e.code.slice(5)-1;sc()}
   if(e.code.startsWith('Arrow'))e.preventDefault();
  }
 }
if(S=='play'&&['KeyW','KeyA','KeyS','KeyD'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;if(painting)paint(e)});
cv.addEventListener('mousedown',e=>{if(S=='edit'){painting=true;paint(e)}else if(e.button===0){if(tab){const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;for(const b of camBtns)if(mx>b.x&&mx<b.x+b.w&&my>b.y&&my<b.y+b.h){ci=b.i;camT=performance.now()}}else interact()}});
addEventListener('mouseup',()=>{painting=false});
// ================= Режим Жёлтого: охранник =================
const FSIDE={W:'l',R:'r',S:'r',N:'l',H:'r',E:'l',L:'r'},FSPD={W:90,R:55,S:80,N:85,H:105,E:70,L:90};
const FH={W:'Слышь, Бродяга стучал слева. Ты ну типа дверь будешь закрывать??? (A)',R:'Доходяга пришёл справа. Он тихий, но дверь (D) сама не закроется.',S:'Статуя шагает, когда на неё не смотрят. Держи её в камере.',N:'Шум лезет, пока ты залип в планшете. Не сиди в камерах вечно.',H:'Тень быстрая, когда ты в камерах. Закрой дверь или свети вспышкой.',E:'Старик звереет от вспышки. Не свети на него, просто закрой дверь.',L:'Флод бежит на вспышки. Не свети зря.',A:'Художник лез в картину. Свети на неё вспышкой (E), пока он не пролез.'};
function seenBy(m){if(!tab||!camList.length)return false;const c=camList[(ci%camList.length+camList.length)%camList.length],cx=c[0]*T+T/2,cy=c[1]*T+T/2;return Math.hypot(m.x-cx,m.y-cy)<330&&LOS(cx,cy,m.x,m.y)}
function fnKill(m){lostBy=null;end(false,'Вас поймал: '+ENEMIES[m.k].name+'.\n\n🟡 Жёлтый: «'+(FH[m.k]||'Ну ты даёшь.')+'»')}
function fnTick(dt){
 flashCd=Math.max(0,flashCd-dt);
 if(back>0){back-=dt;if(back<=0){fnKill({k:'A'});return true}}
 if(bat<=0){tab=false;if(od.l||od.r){od.l=od.r=0;applyDoors();say('Энергия кончилась: двери открылись!')}}
 return S!='play';
}
function fnAI(m,dt){
 const k=m.k;if(k=='A')return fnArtist(m,dt);
 if(m.hype>0)m.hype-=dt;
 if(m.hold==null)m.hold=rnd(10,45);if(m.hold>0){m.hold-=dt;return}
 const s=FSIDE[k]||'l',dc=fcell[s],gx=dc[0]+(s=='l'?-1:1),gy=dc[1],cx=m.x/T|0,cy=m.y/T|0;
 const sp=FSPD[k]*(k=='H'&&tab?1.6:1)*(m.rage?1.8:1)*(m.hype>0?1.6:1);
 if(m.ret>0){m.ret-=dt;m.at=0;return wander(m,sp,dt)}
 if((k=='S'&&seenBy(m))||(k=='N'&&!tab))return;
 if(cx==gx&&cy==gy){
  m.at=(m.at||0)+dt;
  if(!od[s]&&m.at>1)return fnKill(m);
  if(od[s]&&m.at>(k=='R'?10:7)&&!m.rage){m.ret=rnd(8,14);m.at=0;m.gf=null}
  return;
 }
 m.at=0;if(!m.gf)m.gf=field(gx,gy);
 if(m.gf[cy*W+cx]>=9999)return wander(m,sp*.7,dt);
 stepMonster(m,m.gf,sp,dt);
}
function fnArtist(m,dt){
 const ps=find('T');m.cd=m.cd==null?rnd(18,30):m.cd;
 if(m.tp>0){m.tp-=dt;if(m.tp<=0){m.tp=0;back=2.2;m.cd=rnd(30,45)}return}
 if(!ps.length)return wander(m,45,dt);
 m.cd-=dt;if(m.cd>0)return wander(m,40,dt);
 if(!m.pf){m.pp=ps[Math.random()*ps.length|0];m.pf=field(m.pp[0],m.pp[1])}
 if((m.x/T|0)==m.pp[0]&&(m.y/T|0)==m.pp[1]){m.tp=5;m.pf=null;return}
 stepMonster(m,m.pf,60,dt);
}
function flash(){
 if(S!='play'||!tab||!camList.length||flashCd>0)return;
 flashCd=4;lureFx=1.2;beep();bat=Math.max(0,bat-.02);
 for(const m of mons){
  if(m.k=='L')m.hype=6;
  if(!seenBy(m))continue;
  if(m.tp>0){m.tp=0;m.pf=null;m.cd=rnd(25,40)}
  if(m.k=='E')m.rage=1;
  m.stun=2.5;
 }
}
function odToggle(s){
 if(bat<=0)return say('Нет энергии');
 od[s]=od[s]?0:1;applyDoors();say((s=='l'?'Левая':'Правая')+' дверь '+(od[s]?'закрыта':'открыта'));
}
function camDoor(){
 const c=camList[(ci%camList.length+camList.length)%camList.length];let best=null,bd=9;
 find('D').forEach(([x,y])=>{const d=Math.abs(x-c[0])+Math.abs(y-c[1]);if(d<bd){bd=d;best=[x,y]}});
 if(!best)return say('Рядом с камерой нет двери');
 const k=dkey(best[0],best[1]);
 if(!ds[k]&&mons.some(m=>near(m.x,m.y,best[0],best[1],11)))return say('Дверь не закрывается: что-то мешает');
 ds[k]=!ds[k];applyDoors();mons.forEach(m=>{m.t=null;m.fld=null;m.gf=null});say('Дверь у камеры '+(ds[k]?'закрыта':'открыта'));
}
loadMap();menu();requestAnimationFrame(loop);
