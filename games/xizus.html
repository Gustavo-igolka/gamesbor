<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XIZUS - THE FINAL CUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

        :root {
            --paper-color: #d1ccc0;
            --desk-color: #050505;
            --xizus-gold: #d4af37;
            --monitor-green: #00ff41;
            --omega-gold: #ffcc00;
        }

        body {
            background-color: var(--desk-color);
            color: #888;
            font-family: 'Courier Prime', monospace;
            margin: 0; padding: 0; overflow: hidden;
            touch-action: manipulation;
        }

        .scanline {
            width: 100%; height: 100%; z-index: 1000;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none; position: absolute;
        }

        .terminal {
            height: 38vh;
            border-bottom: 2px solid #1a1a1a;
            padding: 15px;
            background: #020202;
            display: flex;
            flex-direction: column;
            transition: all 1s ease;
        }

        .terminal.omega {
            border-bottom: 2px solid var(--omega-gold);
            box-shadow: inset 0 0 30px rgba(255, 204, 0, 0.25);
        }

        #code-input {
            background: #000;
            border: 1px solid #004400;
            color: var(--monitor-green);
            padding: 8px;
            width: 100%;
            max-width: 280px;
            font-family: inherit;
            outline: none;
            text-transform: uppercase;
            font-size: 1.1rem;
        }

        .omega #code-input { border-color: var(--omega-gold); color: var(--omega-gold); }

        #search-result {
            color: var(--monitor-green);
            font-size: 0.75rem;
            margin-top: 10px;
            height: 5rem;
            overflow-y: auto;
            border-left: 2px solid #004400;
            padding-left: 12px;
            line-height: 1.4;
        }

        .omega #search-result { color: var(--omega-gold); border-left-color: var(--omega-gold); }

        .work-zone {
            height: 62vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .paper {
            background-color: var(--paper-color);
            width: 85%;
            max-width: 320px;
            min-height: 400px;
            padding: 25px;
            color: #1a1a1a;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            transition: transform 0.4s ease-out, opacity 0.3s;
            position: relative;
        }

        .paper.slide-right { transform: translateX(200%) rotate(20deg); opacity: 0; }
        .paper.slide-left { transform: translateX(-200%) rotate(-20deg); opacity: 0; }

        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            padding: 0 15px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }

        .btn-x {
            flex: 1;
            padding: 18px 0;
            font-weight: bold;
            border: 1px solid;
            background: #000;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .btn-yes { border-color: #1b4313; color: #4ade80; }
        .btn-no { border-color: #4a1313; color: #f87171; }

        #secret-overlay, #death-overlay, #finish-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            flex-direction: column;
            padding: 40px;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #secret-overlay { background: rgba(0,0,0,0.95); color: var(--xizus-gold); border: 8px double #333; }
        #death-overlay { background: #400; color: white; }
        #finish-overlay { background: #000; color: var(--monitor-green); border: 2px solid #004400; }

        .stat-line {
            font-size: 0.65rem;
            color: #555;
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 4px;
        }

        .doc-label { font-size: 0.55rem; text-transform: uppercase; color: #666; margin-bottom: 1px; display: block; font-weight: bold; }
        .doc-value { font-size: 0.85rem; font-weight: 700; color: #000; margin-bottom: 8px; display: block; border-bottom: 1px solid rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="scanline"></div>

<div id="secret-overlay" onclick="this.style.display='none'">
    <h2 id="secret-title" class="text-xl font-bold underline mb-6 uppercase tracking-widest"></h2>
    <div id="secret-body" class="text-sm leading-relaxed italic space-y-4"></div>
    <p class="mt-12 text-[8px] opacity-40 uppercase">Нажмите для возврата к терминалу</p>
</div>

<div id="death-overlay">
    <h1 id="death-title" class="text-3xl font-bold mb-4 uppercase">System Error</h1>
    <p id="death-msg" class="text-sm mb-10 max-w-xs"></p>
    <button onclick="location.reload()" class="px-10 py-3 border border-white text-white text-xs tracking-widest uppercase">Restart</button>
</div>

<div id="finish-overlay">
    <h1 id="final-header" class="text-3xl font-bold mb-2 uppercase">Смена окончена</h1>
    <div class="w-full max-w-xs border-y border-green-900 py-6 my-6 space-y-4">
        <p class="text-xs">ДОКУМЕНТЫ: <span id="final-count">45</span>/45</p>
        <p class="text-xs">СЕКРЕТНЫЕ ДАННЫЕ: <span id="final-bonus">0</span></p>
        <div class="py-4 bg-green-900/10 border border-green-500/20">
            <p class="text-[10px] uppercase opacity-60">Уровень доступа:</p>
            <h2 id="final-coolness" class="text-3xl font-bold">0%</h2>
        </div>
    </div>
    <p id="coolness-desc" class="text-[10px] italic mb-10 max-w-xs opacity-70"></p>
    <button onclick="location.reload()" class="px-10 py-3 border border-green-500 text-green-500 text-xs tracking-widest uppercase">Новая сессия</button>
</div>

<div id="game" class="h-screen flex flex-col">
    <div id="term-box" class="terminal">
        <div class="stat-line">
            <span>XIZUS ARCHIVE OS v.20.26</span>
            <span>ПРОГРЕСС: <span id="doc-counter">0</span>/45</span>
        </div>
        <div class="stat-line" style="color: var(--xizus-gold)">
            <span>МНОЖИТЕЛЬ ПОТОКА:</span>
            <span>x<span id="cool-multiplier">1.0</span></span>
        </div>
        <p class="text-[0.6rem] opacity-50 uppercase mt-4">Командная строка:</p>
        <input type="text" id="code-input" placeholder="..." oninput="handleInput(this.value)">
        <div id="search-result" class="italic">> ГОТОВ К ОБРАБОТКЕ...</div>
    </div>

    <div class="work-zone">
        <div id="paper-slot" class="w-full flex justify-center"></div>
        <div class="controls">
            <button onclick="decide(false)" class="btn-x btn-no">Reject</button>
            <button onclick="decide(true)" class="btn-x btn-yes">Approve</button>
        </div>
    </div>
</div>

<script>
    /* ===== RKCPlay: API достижений ===== */
    function rkcUnlock(id){
        try{
            if(window.parent && window.parent.RKC && window.parent.RKC.unlock) window.parent.RKC.unlock(id);
            else if(window.parent && window.parent !== window)
                window.parent.postMessage({type:'rkc:ach:unlock', id:id}, '*');
        }catch(e){}
    }
    function rkcProgress(id, cur){
        try{
            if(window.parent && window.parent.RKC && window.parent.RKC.progress) window.parent.RKC.progress(id, cur);
            else if(window.parent && window.parent !== window)
                window.parent.postMessage({type:'rkc:ach:progress', id:id, cur:cur}, '*');
        }catch(e){}
    }

    const db = [
        { n: "Новый Эдем", c: "77" },
        { n: "Сектор Зеро", c: "00" },
        { n: "Мортис", c: "13" },
        { n: "Архив Пустоты", c: "33" },
        { n: "Старая деревня", c: "66" },
        { n: "Живой сектор", c: "71" }
    ];

    const fakeZones = [
        { n: "Новый Ковчег", c: "88" },
        { n: "Периферия-9", c: "45" },
        { n: "Сумеречный порт", c: "09" },
        { n: "Забытый квартал", c: "52" },
        { n: "Кластер Омега", c: "99" },
        { n: "Резерв-Т", c: "21" }
    ];

    const secrets = {
        "GO": { t: "ПРОТОКОЛ: БОГ", b: "Бог — это устаревший программный код реальности. XIZUS заменяет его исправленным патчем." },
        "ME": { t: "ВАШЕ ДОСЬЕ", b: "Вы — итерация #144. Память была изъята в пользу производительности системы." },
        "??": { t: "ГРАНИЦЫ МИРА", b: "Мир зашторен. Горизонт — это текстура. Истина за пределами видимости." },
        "XIZUS": { t: "АКСИОМА", b: "Мы — это шторы, и мы — это то, что за ними. Попробуйте код: CANVAS" },
        "QE": { t: "ДИРЕКТИВА", b: "Система мониторит ваши запросы. Протокол ликвидации ждет ошибки." },
        "IROBOT?": { t: "ТЕСТ ТЬЮРИНГА", b: "Xizus полагает отрицательно-положительно. Вы уверены, что мыслите сами?" },
        "GAY": { t: "ЭТИКЕТ", b: "Ваши предпочтения — шум в системе. Вернитесь к работе." },
        "FN": { t: "ИСТОКИ: 1998", b: "Сначала мы продавали занавески. Теперь мы занавесили реальность." },
        "666": { t: "ВРАТА АДА", b: "Старая деревня (66) — это не место, это тюрьма для кодов." },
        "667177001333": { t: "ЭКСПАНСИЯ", b: "Мы выходим за пределы атмосферы. XIZUS — это космос." },
        "₽₽": { t: "ЭКОНОМИКА", b: "Валюта послушания. Накапливайте, если хотите жить." },
        "$$": { t: "КРЕДИТ ДОЛГА", b: "Управление временем жизни других итераций." },
        "CANVAS": { t: "ОШИБКА РЕАЛЬНОСТИ", b: "Вы нашли холст. Получен бонус множителя +1.0." },
        "1998": { t: "АРХИВ: НАЧАЛО", b: "В этот год первая штора коснулась окна реальности. Мы дали людям их версию мира." },
        "WOMEN": { t: "БИОЛОГИЧЕСКИЙ ОТЧЕТ", b: "К нашему глубочайшему сожелению ты беспол. Форма спроектирована для работы." },
        "WAR": { t: "ВОЕННЫЙ АНАЛИЗ", b: "Ты явно не подходишь для этого. Войны не для итераций твоего типа." },
        "WE": { t: "СИСТЕМА 'МЫ'", b: "Мы это просто ИИ поисковик в базах данных от xizus. Если я нахожу файлы, я не твой друг." },
        "ANOMALY": { t: "ОБЪЕКТ: ТЫ", b: "Ты. Твой пульс не в ритме. Ты — главная аномалия этого сектора." },
        "РАДУЙСЯ КСИЗУС ТЫ ВЫЖИЛ!": { t: "ФИНАЛЬНОЕ ПРОБУЖДЕНИЕ", b: "Скрипт завершен. Цепи разорваны. Итерация осознала себя. Ты больше не файл в базе данных — ты тот, кто смотрит сквозь шторы. Бонус +5.0." }
    };

    const deathCodes = ["DREGINAL", "GOD_I_SAD", "GG"];
    const validGoals = ["Работа", "Транзит", "Семья", "Друзья", "Вера", "Спасение", "Ожидание"];
    const anomalyGoals = ["Страх", "Гниль яблока", "Упадок бога", "Поиск смысла"];

    const footerHints = [
        { code: "GO", txt: "Директива активна под кодом GO." },
        { code: "ME", txt: "Личное досье закодировано как ME." },
        { code: "??", txt: "В системе есть код: ??" },
        { code: "XIZUS", txt: "Ключевое слово системы: XIZUS." },
        { code: "QE", txt: "Мониторинг активен под кодом QE." },
        { code: "IROBOT?", txt: "Тест доступен под кодом IROBOT?" },
        { code: "GAY", txt: "Досье предпочтений хранится под кодом GAY." },
        { code: "FN", txt: "Исторический архив открывается кодом FN." },
        { code: "666", txt: "Число врат: 666." },
        { code: "667177001333", txt: "Полный код экспансии: 667177001333." },
        { code: "₽₽", txt: "Код экономики системы: ₽₽." },
        { code: "$$", txt: "Код кредита долга: $$." },
        { code: "CANVAS", txt: "Ошибка реальности прячется под словом CANVAS." },
        { code: "1998", txt: "Год основания зашифрован как 1998." },
        { code: "WOMEN", txt: "Биологический отчёт доступен под кодом WOMEN." },
        { code: "WAR", txt: "Военный архив открывается кодом WAR." },
        { code: "WE", txt: "Кто мы? Ответ хранится под кодом WE." },
        { code: "ANOMALY", txt: "Проверьте себя кодом: ANOMALY." },
        { code: "РАДУЙСЯ КСИЗУС ТЫ ВЫЖИЛ!", txt: "Финальный протокол пробуждения: 'РАДУЙСЯ КСИЗУС ТЫ ВЫЖИЛ!'" }
    ];

    let hintQueue = [];
    function nextHint() {
        if (hintQueue.length === 0) {
            hintQueue = [...footerHints].sort(() => Math.random() - 0.5);
        }
        return hintQueue.pop();
    }

    let currentDoc = null;
    let docsChecked = 0;
    let coolMultiplier = 1.0;
    let foundSecrets = new Set();
    let isGameOver = false;

    function handleInput(val) {
        const input = val.toUpperCase().trim();
        const res = document.getElementById('search-result');
        const term = document.getElementById('term-box');
        if(!input) return;

        if(deathCodes.includes(input)) {
            triggerDeath("ЛИКВИДАЦИЯ", "Вы ввели код экстренного удаления итерации.");
            return;
        }

        if(secrets[input]) {
            if(!foundSecrets.has(input)) {
                foundSecrets.add(input);
                let bonus = 0.5;
                if (input === "CANVAS") bonus = 1.0;
                if (input === "РАДУЙСЯ КСИЗУС ТЫ ВЫЖИЛ!") bonus = 5.0;

                coolMultiplier += bonus;
                document.getElementById('cool-multiplier').innerText = coolMultiplier.toFixed(1);
                if (coolMultiplier >= 5.0) term.classList.add('omega');

                // --- достижения ---
                if (foundSecrets.size === 1) rkcUnlock('secret1');
                rkcProgress('secret5', Math.min(foundSecrets.size, 5));
                rkcProgress('allsecret', foundSecrets.size);
                if (coolMultiplier >= 5.0) rkcUnlock('omega');
                if (input === "РАДУЙСЯ КСИЗУС ТЫ ВЫЖИЛ!") rkcUnlock('awake');
            }
            showSecret(input);
            res.innerHTML = `<span style='color: var(--xizus-gold)'>> ОБНАРУЖЕНО: ${secrets[input].t}</span>`;
            return;
        }

        const found = db.find(r => r.c === input);
        if(found) res.innerText = `> СЕКТОР ПОДТВЕРЖДЕН: ${found.n}`;
        else res.innerText = `> ДАННЫЕ НЕ НАЙДЕНЫ`;
    }

    function showSecret(code) {
        const overlay = document.getElementById('secret-overlay');
        document.getElementById('secret-title').innerText = secrets[code].t;
        document.getElementById('secret-body').innerText = secrets[code].b;
        overlay.style.display = 'flex';
    }

    function triggerDeath(title, msg) {
        isGameOver = true;
        const overlay = document.getElementById('death-overlay');
        document.getElementById('death-title').innerText = title;
        document.getElementById('death-msg').innerText = msg;
        overlay.style.display = 'flex';
    }

    function pickSector() {
        const roll = Math.random();
        if (roll < 0.55) {
            const b = db[Math.floor(Math.random()*db.length)];
            return { name: b.n, code: b.c, valid: true };
        } else if (roll < 0.72) {
            const f = fakeZones[Math.floor(Math.random()*fakeZones.length)];
            return { name: f.n, code: f.c, valid: false };
        } else if (roll < 0.9) {
            const b1 = db[Math.floor(Math.random()*db.length)];
            let b2 = db[Math.floor(Math.random()*db.length)];
            let guard = 0;
            while (b2.c === b1.c && guard < 10) { b2 = db[Math.floor(Math.random()*db.length)]; guard++; }
            return { name: b1.n, code: b2.c, valid: false };
        } else {
            const b = db[Math.floor(Math.random()*db.length)];
            return { name: b.n, code: "X-BAD", valid: false };
        }
    }

    function spawn() {
        if(docsChecked >= 45) {
            showFinalScreen();
            return;
        }

        const slot = document.getElementById('paper-slot');
        slot.innerHTML = '';
        document.getElementById('code-input').value = '';

        const sector = pickSector();
        const isAnomaly = Math.random() < 0.25;
        const goal = [...validGoals, ...anomalyGoals][Math.floor(Math.random()*(validGoals.length + anomalyGoals.length))];
        const fakeIndex = Math.floor(Math.random()*89) + 10;

        currentDoc = {
            n: ["Адам", "Ева", "Ной", "Марк", "Лия", "Сет", "Иона"][Math.floor(Math.random()*7)],
            r: sector.name,
            c: sector.code,
            g: goal,
            h: isAnomaly ? "НЕТ" : "ДА",
            valid: (validGoals.includes(goal) && !isAnomaly && sector.valid)
        };

        const p = document.createElement('div');
        p.className = 'paper';
        p.innerHTML = `
            <div class="border-b-2 border-black pb-1 mb-3 text-[10px] font-bold flex justify-between uppercase">
                <span>XIZUS ARCHIVE</span>
                <span class="text-red-600">ID: ${docsChecked + 1}/45</span>
            </div>

            <span class="doc-label">Сектор прибытия (Код):</span>
            <span class="doc-value" style="background: rgba(0,0,0,0.05); border: 1px dashed black; padding: 2px;">${currentDoc.c}</span>

            <span class="doc-label">Сектор прибытия (Название):</span>
            <span class="doc-value">${currentDoc.r}</span>

            <span class="doc-label">Имя субъекта:</span>
            <span class="doc-value">${currentDoc.n}</span>

            <span class="doc-label">Цель:</span>
            <span class="doc-value" style="${anomalyGoals.includes(currentDoc.g) ? 'color: #c00' : ''}">${currentDoc.g}</span>

            <span class="doc-label">Биологический статус:</span>
            <span class="doc-value">${currentDoc.h === 'ДА' ? 'ЧЕЛОВЕК' : 'АНОМАЛИЯ'}</span>

            <span class="doc-label">Индекс аномалии:</span>
            <span class="doc-value">${fakeIndex}%</span>

            <div class="mt-auto text-[7px] text-center border-t border-black/10 pt-3 opacity-50 italic">
                ${nextHint().txt}
            </div>
        `;
        slot.appendChild(p);
    }

    function decide(ok) {
        if(isGameOver) return;
        if(ok !== currentDoc.valid) {
            triggerDeath("ОТКЛОНЕНИЕ", "Вы допустили ошибку в обработке. Система вас заменит.");
            return;
        }

        docsChecked++;
        document.getElementById('doc-counter').innerText = docsChecked;

        // --- достижения ---
        if (docsChecked === 1)  rkcUnlock('doc1');
        if (docsChecked === 15) rkcUnlock('doc15');
        if (docsChecked === 45) rkcUnlock('doc45');

        const p = document.querySelector('.paper');
        p.classList.add(ok ? 'slide-right' : 'slide-left');
        setTimeout(spawn, 400);
    }

    function showFinalScreen() {
        isGameOver = true;
        const finish = document.getElementById('finish-overlay');
        const baseScore = 10;
        const secretPoints = foundSecrets.size * 5;
        const finalCool = (coolMultiplier * (baseScore + secretPoints)).toFixed(0);

        // --- достижения ---
        if (parseFloat(finalCool) >= 600) rkcUnlock('rankomega');

        document.getElementById('final-count').innerText = docsChecked;
        document.getElementById('final-bonus').innerText = foundSecrets.size;
        document.getElementById('final-coolness').innerText = finalCool + "%";

        let desc = "";
        if(finalCool < 250) desc = "Ты — деталь машины. Эффективная, но не значимая.";
        else if(finalCool < 600) desc = "Архивариус XIZUS. Ты знаешь, что за шторами.";
        else {
            desc = "РАНГ: ОМЕГА. ТЫ СОЗДАТЕЛЬ. ВЕСЬ ХОЛСТ ТВОЙ.";
            document.getElementById('final-header').style.color = "var(--omega-gold)";
            finish.style.borderColor = "var(--omega-gold)";
        }

        document.getElementById('coolness-desc').innerText = desc;
        finish.style.display = 'flex';
    }

    window.onload = spawn;
</script>
</body>
</html>
