
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f14">
<title>DRIFT WHEEL · Гонки</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#0b0f14;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  canvas{display:block;position:fixed;inset:0;touch-action:none;}
#ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(5,8,12,.7);color:#e8eef5;touch-action:pan-y;overflow:auto}
.bx{width:min(520px,94vw);padding:18px 22px;background:rgba(14,20,28,.94);border-radius:20px;box-shadow:0 0 0 1px rgba(255,255,255,.12);max-height:96vh;overflow:auto;text-align:center}
.bx h1{font-size:30px;letter-spacing:.08em;color:#ff5a68;margin-bottom:6px}
.bx h3{font-size:12px;color:#8ba6bf;margin:12px 0 6px;letter-spacing:.1em;text-transform:uppercase}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bx button{font:inherit;color:inherit;border:0;border-radius:999px;padding:9px 16px;background:rgba(255,255,255,.1);cursor:pointer}
.bx button.on{background:#e63946;color:#fff}
.bx button:hover{background:#41e3ff;color:#06222b}
#go,#again{margin-top:16px;padding:12px 34px;background:#2fbf71!important;font-weight:800;font-size:17px;color:#fff}
.hn{margin-top:12px;font-size:12px;color:#8ba6bf;line-height:1.5}
#res ol{text-align:left;margin:12px 0 0 24px;line-height:1.7}#res .me{color:#ffe082;font-weight:700}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><div class="bx" id="mn"><h1>DRIFT WHEEL</h1>
<h3>Трасса</h3><div class="row" id="mapB"></div><p class="hn" id="best"></p>
<h3>Соперники</h3><div class="row" id="oppB"></div>
<h3>Круги</h3><div class="row" id="lapB"></div>
<h3>Сложность</h3><div class="row" id="difB"></div>
<button id="go">ЕХАТЬ (Enter)</button>
<p class="hn">A/D или ←/→ — руль · S/↓ — тормоз · W/↑/Shift/Space — нитро · Esc — меню<br>Нитро копится само и от дрифта. Телефон: веди пальцем, справа тормоз и НИТРО</p></div>
<div class="bx" id="res" style="display:none"></div></div>
<script>
(() => {
'use strict';

// ============================================================
//  БАЗА
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, DPR = 1;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

function rr(c, x, y, w, h, r) {
  r = Math.min(r, w * 0.5, h * 0.5);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

// ============================================================
//  ТРАССА
// ============================================================
const ROAD_HALF = 145;
let TRACK_N = 240, track = [], decor = [];
const MAPS = [
  { name: 'Классика',   f: t => { const r = 1300 + Math.sin(t*3)*240 + Math.cos(t*2+0.7)*120; return [Math.cos(t)*r, Math.sin(t)*r]; } },
  { name: 'Овал-спринт', f: t => [Math.cos(t)*2100, Math.sin(t)*1000 + Math.sin(t*2)*160] },
  { name: 'Звезда',     f: t => { const r = 1350 + Math.cos(t*5)*330; return [Math.cos(t)*r, Math.sin(t)*r]; } }
];
function buildMap(m) {
  track = []; decor = [];
  for (let i = 0; i < TRACK_N; i++) { const p = MAPS[m].f(i / TRACK_N * Math.PI * 2); track.push({ x: p[0], y: p[1] }); }
  for (let i = 0; i < TRACK_N; i++) {
    const a = track[(i-1+TRACK_N)%TRACK_N], b = track[(i+1)%TRACK_N];
    let dx = b.x-a.x, dy = b.y-a.y; const l = Math.hypot(dx,dy)||1; dx/=l; dy/=l;
    for (const sd of [-1, 1]) if (Math.random() < 0.5) {
      const off = ROAD_HALF + 55 + Math.random()*240;
      decor.push({ x: track[i].x - dy*off*sd, y: track[i].y + dx*off*sd, r: 13 + Math.random()*20, t: Math.random() });
    }
  }
}

let car, cars = [];

// ============================================================
//  УПРАВЛЕНИЕ
// ============================================================
const WHEEL_MAX = 2.0;
const wheel = { angle: 0 };

let steerTouch = null;     // { id, startX }
let targetSteer = 0;       // -1 .. 1
let steerValue = 0;        // сглаженное
let gasHeld = true;
let brakeHeld = false;

let touchUsed = matchMedia('(pointer:coarse)').matches;
let nitroHeld = false;
const ui = {
  nitro: { x: 0, y: 0, r: 50 },
  wheel: { cx: 0, cy: 0, r: 100 },
  brake: { x: 0, y: 0, r: 60 }
};

function layoutUI() {
  const wR = clamp(Math.min(W * 0.22, H * 0.13), 58, 110);
  ui.wheel.r  = wR;
  ui.wheel.cx = wR + Math.max(16, W * 0.04);
  ui.wheel.cy = H - wR - Math.max(16, H * 0.03);

  const bR = clamp(Math.min(W * 0.16, H * 0.095), 50, 84);
  ui.brake.r = bR;
  ui.brake.x = W - bR - Math.max(22, W * 0.05);
  ui.brake.y = H - bR - Math.max(22, H * 0.045);
  ui.nitro.r = bR * 0.85;
  ui.nitro.x = ui.brake.x - bR * 2.2;
  ui.nitro.y = ui.brake.y;
}

let baseZoom = 0.6;
function computeZoom() { baseZoom = clamp(W / 650, 0.45, 1.05); }

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layoutUI();
  computeZoom();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 180));

// ---------- обработка касаний ----------
const pointers = new Map();

function d2(x1, y1, x2, y2) {
  const dx = x1 - x2, dy = y1 - y2;
  return dx * dx + dy * dy;
}

function onDown(id, x, y) {
  if (pointers.has(id)) return;
  if (id === 'mouse' && !touchUsed) return;
  if (state !== 'race' && state !== 'count') return;
  if (d2(x, y, ui.nitro.x, ui.nitro.y) < (ui.nitro.r * 1.15) ** 2) { pointers.set(id, { type: 'nitro' }); return; }

  // Кнопка тормоза?
  if (d2(x, y, ui.brake.x, ui.brake.y) < (ui.brake.r * 1.15) ** 2) {
    pointers.set(id, { type: 'brake' });
    return;
  }

  // Иначе — старт руления (только первое касание)
  if (!steerTouch) {
    steerTouch = { id, startX: x };
    pointers.set(id, { type: 'steer' });
  } else {
    pointers.set(id, { type: 'other' });
  }
}

function onMove(id, x) {
  const p = pointers.get(id);
  if (!p || p.type !== 'steer') return;
  if (!steerTouch || steerTouch.id !== id) return;

  const dx = x - steerTouch.startX;
  // 18% ширины экрана = полный поворот — комфортно
  targetSteer = clamp(dx / (W * 0.18), -1, 1);
}

function onUp(id) {
  const p = pointers.get(id);
  if (!p) return;
  if (p.type === 'steer' && steerTouch && steerTouch.id === id) {
    steerTouch = null;
    targetSteer = 0;
  }
  pointers.delete(id);
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault(); touchUsed = true;
  for (const t of e.changedTouches) onDown(t.identifier, t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) onMove(t.identifier, t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) onUp(t.identifier);
}, { passive: false });

canvas.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) onUp(t.identifier);
}, { passive: false });

// мышь для ПК
canvas.addEventListener('mousedown', e => onDown('mouse', e.clientX, e.clientY));
window.addEventListener('mousemove', e => onMove('mouse', e.clientX, e.clientY));
window.addEventListener('mouseup',   () => onUp('mouse'));

// клавиатура
const keys = Object.create(null);
window.addEventListener('keydown', e => {
  keys[e.key] = keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key)) e.preventDefault();
  hotkeys(e);
});
window.addEventListener('keyup', e => { keys[e.key] = keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ============================================================
//  ЭФФЕКТЫ
// ============================================================
const particles = [];
const skid = [];
const lastSkid = { L: null, R: null };

function spawnSmoke(x, y, vx, vy, col) {
  if (particles.length > 150) return;
  particles.push({
    x, y,
    vx: vx * 0.15 + (Math.random() - 0.5) * 55,
    vy: vy * 0.15 + (Math.random() - 0.5) * 55,
    life: 0.5 + Math.random() * 0.4,
    max: 0.9,
    size: 5 + Math.random() * 6, col: col
  });
}

// ============================================================
//  ЛОГИКА
// ============================================================
let score = 0;
let driftTimer = 0;
let driftCombo = 1;
let drifting = false;
let hintAlpha = 1;

let camX = 0, camY = 0, zoom = 0.6;

function nearestOnTrack(x, y) {
  let bd = 1e18, bx = 0, by = 0, bi = 0, bt = 0;
  for (let i = 0; i < TRACK_N; i++) {
    const a = track[i], b = track[(i+1)%TRACK_N];
    const abx = b.x-a.x, aby = b.y-a.y, apx = x-a.x, apy = y-a.y, l2 = abx*abx + aby*aby;
    let t = l2 > 0 ? (apx*abx + apy*aby) / l2 : 0; t = t < 0 ? 0 : (t > 1 ? 1 : t);
    const px = a.x + abx*t, py = a.y + aby*t, dx = x-px, dy = y-py, d = dx*dx + dy*dy;
    if (d < bd) { bd = d; bx = px; by = py; bi = i; bt = t; }
  }
  return { d2: bd, px: bx, py: by, i: bi, t: bt };
}

function readInputs(dt) {
  if (!steerTouch) {
    if (keys.ArrowLeft || keys.KeyA) targetSteer = -1;
    else if (keys.ArrowRight || keys.KeyD) targetSteer = 1;
    else targetSteer = 0;
  }
  let b = !!(keys.ArrowDown || keys.KeyS), n = !!(keys.ArrowUp || keys.KeyW || keys.Space || keys.ShiftLeft || keys.ShiftRight);
  for (const p of pointers.values()) { if (p.type === 'brake') b = true; if (p.type === 'nitro') n = true; }
  brakeHeld = b; nitroHeld = n; gasHeld = !b;
  const rate = steerTouch ? 20 : 11;
  steerValue += (targetSteer - steerValue) * Math.min(1, rate * dt);
  steerValue = clamp(steerValue, -1, 1);
  car.steer = steerValue;
  wheel.angle = steerValue * WHEEL_MAX;
}

function stepCar(c, steer, brake, nit, dt) {
  c.steer = steer;
  const cs = Math.cos(c.angle), sn = Math.sin(c.angle);
  let vf = c.vx*cs + c.vy*sn, vl = -c.vx*sn + c.vy*cs;
  const MAXV = nit ? 1400 : 1000;
  if (!brake) { const p = 1 - Math.max(0, vf) / MAXV; vf += (1400 + (nit ? 1500 : 0)) * c.skill * Math.max(0.15, p) * dt; }
  else vf -= (vf > 0 ? 2400 : 800) * dt;
  vf -= vf * 0.55 * dt;
  const spd = Math.hypot(vf, vl);
  const sf = clamp((spd - 180) / 520, 0, 1) * Math.abs(steer);
  let grip = 14 - 10.5 * sf;
  if (brake && spd > 120) grip *= 0.4;
  grip = Math.max(3.0, grip);
  vl *= Math.exp(-grip * dt);
  vf -= Math.abs(vl) * 0.22 * dt * (vf >= 0 ? 1 : -1);
  c.angle += steer * 2.9 * clamp(spd / 240, 0, 1) * (vf >= 0 ? 1 : -1) * dt;
  c.vx = cs*vf - sn*vl; c.vy = sn*vf + cs*vl; c.vf = vf; c.vl = vl;
  c.x += c.vx * dt; c.y += c.vy * dt;
  c.hit = false;
  const near = nearestOnTrack(c.x, c.y), d = Math.sqrt(near.d2), lim = ROAD_HALF - 16;
  c.ni = near.i; c.nt = near.t;
  if (d > lim && d > 0.001) {
    const nx = (c.x - near.px) / d, ny = (c.y - near.py) / d, over = d - lim;
    c.x -= nx * over; c.y -= ny * over;
    const vn = c.vx*nx + c.vy*ny;
    if (vn > 0) {
      c.vx -= nx*vn*1.55; c.vy -= ny*vn*1.55;
      if (c.isP && vn > 180) for (let i = 0; i < 4; i++) spawnSmoke(c.x, c.y, -nx*120, -ny*120);
    }
    c.vx *= 0.94; c.vy *= 0.94; c.hit = true;
  }
  c.slip = Math.abs(vl); c.spd = spd;
}

function updateEffects(dt) {
  const cs = Math.cos(car.angle), sn = Math.sin(car.angle);
  const rearX = car.x - cs * 15;
  const rearY = car.y - sn * 15;
  const latX = -sn * 10, latY = cs * 10;

  const wl = { x: rearX - latX, y: rearY - latY };
  const wr = { x: rearX + latX, y: rearY + latY };

  if (drifting || (brakeHeld && Math.abs(car.vl) > 60)) {
    if (lastSkid.L) {
      skid.push({ x1: lastSkid.L.x, y1: lastSkid.L.y, x2: wl.x, y2: wl.y });
      skid.push({ x1: lastSkid.R.x, y1: lastSkid.R.y, x2: wr.x, y2: wr.y });
      if (skid.length > 900) skid.splice(0, skid.length - 900);
    }
    lastSkid.L = wl;
    lastSkid.R = wr;

    if (Math.random() < 0.75) spawnSmoke(wl.x, wl.y, car.vx, car.vy);
    if (Math.random() < 0.75) spawnSmoke(wr.x, wr.y, car.vx, car.vy);
  } else {
    lastSkid.L = null;
    lastSkid.R = null;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const k = Math.exp(-2.6 * dt);
    p.vx *= k;
    p.vy *= k;
  }

  if (hintAlpha > 0) hintAlpha -= dt * 0.35;
}

// ============================================================
//  ОТРИСОВКА
// ============================================================
function traceTrack() {
  ctx.beginPath();
  ctx.moveTo(track[0].x, track[0].y);
  for (let i = 1; i < TRACK_N; i++) ctx.lineTo(track[i].x, track[i].y);
  ctx.closePath();
}

function render(dt) {
  const spd = Math.hypot(car.vx, car.vy);

  const tx = car.x + car.vx * 0.22;
  const ty = car.y + car.vy * 0.22;
  const camK = Math.min(1, 5 * dt);
  camX += (tx - camX) * camK;
  camY += (ty - camY) * camK;

  const targetZoom = baseZoom * (1 - Math.min(0.3, spd / 4200));
  zoom += (targetZoom - zoom) * Math.min(1, 3.5 * dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#14261a';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(zoom, zoom);
  ctx.translate(-camX, -camY);

  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // бордюр
  traceTrack();
  ctx.lineWidth = ROAD_HALF * 2 + 32;
  ctx.strokeStyle = '#c9484d';
  ctx.stroke();

  // асфальт
  traceTrack();
  ctx.lineWidth = ROAD_HALF * 2;
  ctx.strokeStyle = '#343a42';
  ctx.stroke();

  // разметка
  ctx.setLineDash([46, 46]);
  traceTrack();
  ctx.lineWidth = 7;
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.stroke();
  ctx.setLineDash([]);
  { const a = track[0], b = track[1]; ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(Math.atan2(b.y-a.y, b.x-a.x));
    for (let r = 0; r < 10; r++) for (let q = 0; q < 2; q++) { ctx.fillStyle = (r+q)&1 ? '#fff' : '#111'; ctx.fillRect(q*16-16, -ROAD_HALF + r*29, 16, 29); }
    ctx.restore(); }

  // следы
  if (skid.length) {
    ctx.beginPath();
    for (let i = 0; i < skid.length; i++) {
      const s = skid[i];
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
    }
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(14,14,18,0.5)';
    ctx.stroke();
  }

  // декор
  const vw = W / zoom * 0.5 + 120;
  const vh = H / zoom * 0.5 + 120;
  for (let i = 0; i < decor.length; i++) {
    const d = decor[i];
    if (Math.abs(d.x - camX) > vw || Math.abs(d.y - camY) > vh) continue;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = d.t > 0.5 ? '#1d3d26' : '#193420';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(d.x - d.r * 0.25, d.y - d.r * 0.25, d.r * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(60,120,70,0.35)';
    ctx.fill();
  }

  // дым
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = (p.life / p.max) * 0.38;
    if (a <= 0) continue;
    const grow = 1 + (1 - p.life / p.max) * 1.9;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * grow, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + (p.col || '215,220,230') + ',' + a.toFixed(3) + ')';
    ctx.fill();
  }

  for (let i = cars.length - 1; i >= 0; i--) drawCar(cars[i]);
  ctx.restore();

  drawHUD(spd);
  if (touchUsed && (state === 'race' || state === 'count')) { drawWheelUI(); drawBrakeBtn(); drawNitroBtn(); }
  drawBanner();
}

function drawCar(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.angle);

  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  rr(ctx, -21, -11, 46, 26, 8);
  ctx.fill();

  ctx.fillStyle = '#14171b';
  rr(ctx, -21, -16, 13, 7, 2.5); ctx.fill();
  rr(ctx, -21,   9, 13, 7, 2.5); ctx.fill();

  const sa = c.steer * 0.55;
  ctx.save();
  ctx.translate(16, -13); ctx.rotate(sa);
  rr(ctx, -7, -3.5, 14, 7, 2.5); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(16,  13); ctx.rotate(sa);
  rr(ctx, -7, -3.5, 14, 7, 2.5); ctx.fill();
  ctx.restore();

  const g = ctx.createLinearGradient(0, -13, 0, 13);
  g.addColorStop(0, c.col[0]);
  g.addColorStop(0.5, c.col[1]);
  g.addColorStop(1, c.col[2]);
  ctx.fillStyle = g;
  rr(ctx, -23, -12.5, 46, 25, 8);
  ctx.fill();

  ctx.fillStyle = '#1b2733';
  rr(ctx, -7, -9.5, 17, 19, 5);
  ctx.fill();

  ctx.fillStyle = 'rgba(120,190,255,0.35)';
  rr(ctx, 2, -8, 7, 16, 3);
  ctx.fill();

  ctx.fillStyle = '#fff2b0';
  rr(ctx, 21, -10.5, 3, 5, 1.5); ctx.fill();
  rr(ctx, 21,   5.5, 3, 5, 1.5); ctx.fill();

  ctx.fillStyle = 'rgba(255,60,60,0.9)';
  rr(ctx, -23.5, -10, 2.5, 5, 1); ctx.fill();
  rr(ctx, -23.5,   5, 2.5, 5, 1); ctx.fill();

  ctx.restore();
}

function drawWheelUI() {
  const { cx, cy, r } = ui.wheel;

  ctx.save();
  ctx.translate(cx, cy);

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(8,13,20,0.5)';
  ctx.fill();

  ctx.save();
  ctx.rotate(wheel.angle);

  const col = steerTouch ? '#41e3ff' : '#8ba6bf';

  ctx.beginPath();
  ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2);
  ctx.lineWidth = r * 0.14;
  ctx.strokeStyle = col;
  ctx.stroke();

  ctx.lineCap = 'round';
  ctx.lineWidth = r * 0.105;
  ctx.strokeStyle = col;

  ctx.beginPath();
  ctx.moveTo(-r * 0.78, 0);
  ctx.lineTo( r * 0.78, 0);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, r * 0.78);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, -r * 0.85, r * 0.075, 0, Math.PI * 2);
  ctx.fillStyle = '#ff4d5e';
  ctx.fill();

  ctx.restore();

  // Индикатор отклонения
  const w = r * 1.7;
  ctx.beginPath();
  ctx.moveTo(-w / 2, r * 1.15);
  ctx.lineTo( w / 2, r * 1.15);
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineCap = 'round';
  ctx.stroke();

  const px = -w / 2 + (w / 2) * (steerValue + 1);
  ctx.beginPath();
  ctx.arc(px, r * 1.15, 6, 0, Math.PI * 2);
  ctx.fillStyle = steerTouch ? '#41e3ff' : '#8ba6bf';
  ctx.fill();

  ctx.restore();
}

function drawBrakeBtn() {
  const { x, y, r } = ui.brake;
  ctx.save();
  ctx.translate(x, y);

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = brakeHeld ? '#e0484f' : 'rgba(20,26,34,0.72)';
  ctx.fill();

  ctx.lineWidth = 3;
  ctx.strokeStyle = brakeHeld ? '#ffffff' : '#8f2027';
  ctx.stroke();

  ctx.fillStyle = brakeHeld ? '#ffffff' : '#e6a8ac';
  ctx.font = '800 ' + Math.round(r * 0.28) + 'px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('ТОРМОЗ', 0, 0);

  ctx.restore();
}

function drawBanner() {
  let txt = '', a = 1;
  if (state === 'count') txt = String(Math.ceil(cd));
  else if (goT > 0) { txt = 'ЕХАТЬ!'; a = Math.min(1, goT); }
  if (!txt) return;
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 ' + Math.round(H * 0.2) + 'px system-ui,sans-serif'; ctx.fillStyle = '#ffe082';
  ctx.fillText(txt, W / 2, H * 0.36); ctx.restore();
}
function drawNitroBtn() {
  const { x, y, r } = ui.nitro;
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = nitroHeld ? '#2aa5ff' : 'rgba(20,26,34,0.72)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#41e3ff'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.82, -Math.PI/2, -Math.PI/2 + Math.PI*2*car.nitro); ctx.lineWidth = 5; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '800 ' + Math.round(r * 0.3) + 'px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('НИТРО', 0, 0); ctx.restore();
}

function drawHUD(spd) {
  const kmh = Math.round(spd * 0.25);

  ctx.save();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  ctx.font = '700 12px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(160,190,215,0.85)';
  ctx.fillText('СКОРОСТЬ', 18, 16);

  ctx.font = '800 36px system-ui,sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(kmh, 18, 32);

  ctx.font = '700 13px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(160,190,215,0.7)';
  ctx.fillText('км/ч', 18 + ctx.measureText(kmh).width + 30, 52);

  ctx.textAlign = 'right';
  ctx.font = '700 12px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(160,190,215,0.85)';
  ctx.fillText('ОЧКИ', W - 18, 16);

  ctx.font = '800 30px system-ui,sans-serif';
  ctx.fillStyle = '#ffe082';
  ctx.fillText(Math.floor(score), W - 18, 32);

  ctx.textAlign = 'right'; ctx.font = '800 20px system-ui,sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText((order().indexOf(car) + 1) + '/' + cars.length + ' · Круг ' + clamp(car.lap, 1, cfg.laps) + '/' + cfg.laps, W - 18, 70);
  ctx.font = '700 14px system-ui,sans-serif'; ctx.fillStyle = 'rgba(160,190,215,.9)'; ctx.fillText(fmtT(raceT), W - 18, 96);
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(18, 84, 130, 10);
  ctx.fillStyle = nitroHeld && car.nitro > 0.02 ? '#7be0ff' : '#2aa5ff'; ctx.fillRect(18, 84, 130 * car.nitro, 10);
  ctx.font = '700 11px system-ui,sans-serif'; ctx.fillStyle = 'rgba(160,190,215,.85)'; ctx.fillText('НИТРО', 18, 98);
  if (drifting) {
    ctx.textAlign = 'center';
    ctx.font = '900 26px system-ui,sans-serif';
    ctx.fillStyle = '#ff9f43';
    ctx.fillText('ДРИФТ!', W / 2, 30);

    if (driftCombo > 1.05) {
      ctx.font = '900 20px system-ui,sans-serif';
      ctx.fillStyle = '#ffd166';
      ctx.fillText('x' + driftCombo.toFixed(1), W / 2, 60);
    }
  }

  ctx.restore();
}

// ============================================================
//  ГОНКА: ИИ, круги, победа, меню
// ============================================================
const cfg = { map: 0, opp: 3, laps: 3, dif: 1 };
let state = 'menu', cd = 3, goT = 0, raceT = 0;
const PAL = [['#6aa8ff','#2f6fe0','#1d3f8a'], ['#7ee08a','#2fb457','#1b6b34'], ['#ffe066','#f0b400','#9a7000'],
             ['#c79bff','#8e4de0','#53268f'], ['#f2f2f2','#b8bec7','#6b7480'], ['#ffb066','#f07a1c','#9a4a08'], ['#6ff0e0','#1fb8a8','#0f6b62']];
const NAMES = ['Вольт','Дрифт','Тень','Гром','Искра','Ржавый','Лис'];
const ov = document.getElementById('ov'), mn = document.getElementById('mn'), res = document.getElementById('res');

const fmtT = s => ((s / 60) | 0) + ':' + (s % 60).toFixed(1).padStart(4, '0');
const bk = () => 'dw' + cfg.map + '_' + cfg.laps;
const getBest = () => { try { return +localStorage.getItem(bk()) || 0; } catch (e) { return 0; } };
function bestInfo() { const b = getBest(); document.getElementById('best').textContent = 'Рекорд: ' + (b ? fmtT(b) : '—'); }
const order = () => cars.slice().sort((a, b) => (b.fin - a.fin) || (a.fin ? a.ft - b.ft : b.prog - a.prog));
const angD = d => Math.atan2(Math.sin(d), Math.cos(d));
const segA = i => { const a = track[i % TRACK_N], b = track[(i + 1) % TRACK_N]; return Math.atan2(b.y - a.y, b.x - a.x); };

function mkCar(slot, isP, k) {
  const N = TRACK_N, i = (N - 2 - (slot >> 1) * 2 + N) % N, a = track[i], b = track[(i + 1) % N];
  const ang = Math.atan2(b.y - a.y, b.x - a.x), o = (slot & 1 ? -1 : 1) * 46;
  return { x: a.x - Math.sin(ang) * o, y: a.y + Math.cos(ang) * o, angle: ang, vx: 0, vy: 0, vf: 0, vl: 0, steer: 0,
    nitro: 1, lap: 0, pi: i, ni: i, nt: 0, prog: 0, fin: false, ft: 0, isP, nOn: false, slip: 0, spd: 0, hit: false,
    skill: isP ? 1 : [0.84, 0.92, 0.98][cfg.dif] + Math.random() * 0.04, lane: (Math.random() - 0.5) * 110,
    col: isP ? ['#ff5a68', '#e63946', '#a81f2c'] : PAL[k % PAL.length], name: isP ? 'Ты' : NAMES[k % NAMES.length] };
}
function setupRace() {
  buildMap(cfg.map);
  const n = cfg.opp + 1;
  cars = [mkCar(n - 1, true, 0)];
  for (let k = 0; k < cfg.opp; k++) cars.push(mkCar(k, false, k));
  car = cars[0];
  skid.length = 0; particles.length = 0; lastSkid.L = lastSkid.R = null;
  score = 0; driftTimer = 0; driftCombo = 1; drifting = false; raceT = 0; goT = 0;
  steerValue = targetSteer = 0;
  camX = car.x; camY = car.y; zoom = baseZoom;
}
function startRace() { setupRace(); ov.style.display = 'none'; state = 'count'; cd = 3; }
function toMenu() {
  state = 'menu'; setupRace(); bestInfo();
  mn.style.display = 'block'; res.style.display = 'none'; ov.style.display = 'flex';
}
function showRes() {
  const o = order(), pos = o.indexOf(car) + 1, best = getBest();
  let rec = false;
  if (!best || car.ft < best) { rec = true; try { localStorage.setItem(bk(), car.ft.toFixed(2)); } catch (e) {} }
  res.innerHTML = '<h1>' + (pos === 1 ? '🏆 ПОБЕДА!' : 'Финиш: ' + pos + ' место') + '</h1><p class="hn">Твоё время: ' + fmtT(car.ft) +
    (rec ? ' · 🔥 новый рекорд!' : '') + ' · Очки: ' + Math.floor(score) + '</p><ol>' +
    o.map(c => '<li class="' + (c.isP ? 'me' : '') + '">' + c.name + (c.fin ? ' — ' + fmtT(c.ft) : ' — в гонке') + '</li>').join('') +
    '</ol><div class="row"><button id="again">Ещё раз (Enter)</button><button id="tomenu">Меню (Esc)</button></div>';
  document.getElementById('again').onclick = startRace;
  document.getElementById('tomenu').onclick = toMenu;
  mn.style.display = 'none'; res.style.display = 'block'; ov.style.display = 'flex';
}
function opts(id, arr, key) {
  const el = document.getElementById(id); el.innerHTML = '';
  arr.forEach(([lab, val]) => {
    const b = document.createElement('button'); b.textContent = lab; b.tabIndex = -1;
    if (cfg[key] === val) b.className = 'on';
    b.onclick = () => { cfg[key] = val; b.blur(); buildMenu(); if (key === 'map') setupRace(); };
    el.appendChild(b);
  });
}
function buildMenu() {
  opts('mapB', MAPS.map((m, i) => [(i + 1) + '. ' + m.name, i]), 'map');
  opts('oppB', [1, 3, 5, 7].map(n => [n, n]), 'opp');
  opts('lapB', [2, 3, 5].map(n => [n, n]), 'laps');
  opts('difB', [['Лёгкая', 0], ['Средняя', 1], ['Сложная', 2]], 'dif');
  bestInfo();
}
document.getElementById('go').onclick = startRace;
function hotkeys(e) {
  if (e.code === 'Escape') { if (state !== 'menu') toMenu(); return; }
  if (e.code === 'Enter' && (state === 'menu' || state === 'done')) startRace();
  if (state === 'menu' && e.code.indexOf('Digit') === 0) { const n = +e.code.slice(5) - 1; if (MAPS[n]) { cfg.map = n; buildMenu(); setupRace(); } }
}

function aiCtl(c) {
  const N = TRACK_N, v = Math.hypot(c.vx, c.vy), j = (c.ni + 4 + ((v / 170) | 0)) % N;
  const p = track[j], q = track[(j + 1) % N], r0 = track[(j - 1 + N) % N];
  const tx = q.x - r0.x, ty = q.y - r0.y, tl = Math.hypot(tx, ty) || 1;
  const gx = p.x - ty / tl * c.lane, gy = p.y + tx / tl * c.lane;
  const st = clamp(angD(Math.atan2(gy - c.y, gx - c.x) - c.angle) * 2.4, -1, 1);
  const k = Math.abs(angD(segA(j + 8) - segA(j)));
  const br = v > Math.max(380, (1000 - k * 900) * c.skill) + 40;
  if (!c.nOn && c.nitro > 0.6 && k < 0.1 && !br) c.nOn = true;
  if (c.nOn && (c.nitro < 0.08 || k > 0.2 || br)) c.nOn = false;
  return [st, br, c.nOn];
}
function lapUpdate(c) {
  const i = c.ni, N = TRACK_N;
  if (c.pi > N * 0.75 && i < N * 0.25) c.lap++;
  else if (c.pi < N * 0.25 && i > N * 0.75) c.lap--;
  c.pi = i; c.prog = c.lap * N + i + c.nt;
  if (!c.fin && c.lap > cfg.laps) { c.fin = true; c.ft = raceT; }
}
function stepRace(dt) {
  raceT += dt;
  for (const c of cars) {
    let st, br, nit;
    if (c.isP) { st = steerValue; br = brakeHeld; nit = nitroHeld && c.nitro > 0.02; }
    else [st, br, nit] = aiCtl(c);
    c.nitro = nit ? Math.max(0, c.nitro - 0.38 * dt) : Math.min(1, c.nitro + 0.04 * dt);
    stepCar(c, st, br, nit, dt);
    lapUpdate(c);
    if (nit && Math.random() < 0.8) spawnSmoke(c.x - Math.cos(c.angle) * 24, c.y - Math.sin(c.angle) * 24, c.vx, c.vy, '255,150,40');
    if (c.isP) {
      if (c.slip > 95 && c.spd > 160) {
        driftTimer += dt; driftCombo = Math.min(6, 1 + driftTimer * 0.55);
        score += c.slip * dt * 0.05 * driftCombo; c.nitro = Math.min(1, c.nitro + 0.22 * dt); drifting = true;
      } else { driftTimer = 0; driftCombo = 1; drifting = false; }
      if (c.hit) { driftTimer = 0; driftCombo = 1; }
    }
  }
  for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++) {
    const a = cars[i], b = cars[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d < 34 && d > 0.01) {
      const nx = dx / d, ny = dy / d, push = (34 - d) / 2;
      a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) { const k = rv * 0.45; a.vx += nx * k; a.vy += ny * k; b.vx -= nx * k; b.vy -= ny * k; }
    }
  }
  if (car.fin) { state = 'done'; showRes(); }
}

// ============================================================
//  ЦИКЛ
// ============================================================
let lastT = 0;

function loop(t) {
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) dt = 0.016;

  readInputs(dt);
  if (state === 'count') { cd -= dt; if (cd <= 0) { state = 'race'; raceT = 0; goT = 1; } }
  else if (state === 'race') stepRace(dt);
  if (goT > 0) goT -= dt;
  if (state !== 'done') updateEffects(dt);
  render(dt);

  requestAnimationFrame(loop);
}

// ============================================================
//  СТАРТ
// ============================================================
resize();
buildMenu();
toMenu();
requestAnimationFrame(loop);

})();
</script>
