<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Epic Battle Simulator - Red vs Blue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; overflow: hidden; }
    .code-font { font-family: 'JetBrains Mono', monospace; }
    canvas { touch-action: none; }
    /* Custom scrollbar for control panels */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }
  </style>
</head>
<body class="h-full w-full relative overflow-hidden flex flex-col">

  <!-- Top Control Bar -->
  <header class="absolute top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between gap-3 pointer-events-none">
    
    <!-- Title & Stats Badge -->
    <div class="flex items-center gap-3 bg-slate-900/80 backdrop-blur-md p-2.5 px-4 rounded-xl border border-slate-700/50 shadow-xl pointer-events-auto">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
        <span class="font-bold text-sm text-blue-400">СИНИЕ: <span id="blueCountText">0</span></span>
      </div>
      <div class="text-slate-500 font-bold">VS</div>
      <div class="flex items-center gap-2">
        <span class="font-bold text-sm text-red-400">КРАСНЫЕ: <span id="redCountText">0</span></span>
        <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
      </div>
      <div class="h-4 w-[1px] bg-slate-700 my-auto mx-1"></div>
      <div class="text-xs text-slate-400 code-font">FPS: <span id="fpsText" class="text-emerald-400">60</span></div>
    </div>

    <!-- Game Speed & Control Buttons -->
    <div class="flex items-center gap-2 bg-slate-900/80 backdrop-blur-md p-1.5 rounded-xl border border-slate-700/50 shadow-xl pointer-events-auto">
      <button id="btnPause" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 transition flex items-center gap-1">
        <span id="pauseIcon">⏸</span> <span id="pauseText">Пауза</span>
      </button>
      <div class="flex bg-slate-950 p-1 rounded-lg gap-1 border border-slate-800">
        <button id="btnSpeed1" class="speed-btn px-2.5 py-1 rounded text-xs font-bold bg-indigo-600 text-white">1x</button>
        <button id="btnSpeed2" class="speed-btn px-2.5 py-1 rounded text-xs font-bold text-slate-400 hover:text-white">2x</button>
        <button id="btnSpeed5" class="speed-btn px-2.5 py-1 rounded text-xs font-bold text-slate-400 hover:text-white">5x</button>
      </div>
      <button id="btnRestart" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-900/40 hover:bg-rose-800/60 text-rose-300 border border-rose-700/40 transition">
        🔄 Перезапуск
      </button>
      <button id="btnSound" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300">
        🔊 Sound
      </button>
    </div>
  </header>

  <!-- Left Sidebar: Blue Base Management -->
  <aside class="absolute left-3 top-20 z-10 w-64 bg-slate-900/85 backdrop-blur-md p-3.5 rounded-2xl border border-blue-500/30 shadow-2xl space-y-3 pointer-events-auto transition-all">
    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
      <h3 class="font-bold text-blue-400 flex items-center gap-1.5 text-sm">

      <span id="blueGoldText" class="text-amber-400 font-bold text-xs code-font">🪙 0</span>
    </div>
    <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800">
      <div id="blueHpBar" class="bg-blue-500 h-full transition-all duration-300" style="width: 100%;"></div>
    </div>
    <!-- Spawner controls -->
    <div class="space-y-1.5">
      <div class="text-[11px] font-semibold text-slate-400">ПРИЗВАТЬ ЮНИТА:</div>
      <div class="grid grid-cols-2 gap-1.5 text-xs">
        <button onclick="manualSpawn('blue', 'melee')" class="p-2 rounded-lg bg-slate-800 hover:bg-blue-900/50 border border-slate-700 hover:border-blue-500 text-left transition flex flex-col">
          <span class="font-bold text-slate-200">⚔️ Мечник</span>
          <span class="text-[10px] text-amber-400 code-font">20 🪙</span>
        </button>
        <button onclick="manualSpawn('blue', 'archer')" class="p-2 rounded-lg bg-slate-800 hover:bg-blue-900/50 border border-slate-700 hover:border-blue-500 text-left transition flex flex-col">
          <span class="font-bold text-slate-200">🏹 Лучник</span>
          <span class="text-[10px] text-amber-400 code-font">35 🪙</span>
        </button>
        <button onclick="manualSpawn('blue', 'tank')" class="p-2 rounded-lg bg-slate-800 hover:bg-blue-900/50 border border-slate-700 hover:border-blue-500 text-left transition flex flex-col">
          <span class="font-bold text-slate-200">🛡️️ Гигант</span>
          <span class="text-[10px] text-amber-400 code-font">75 🪙</span>
        </button>
        <button onclick="manualSpawn('blue', 'mage')" class="p-2 rounded-lg bg-slate-800 hover:bg-blue-900/50 border border-slate-700 hover:border-blue-500 text-left transition flex flex-col">
          <span class="font-bold text-slate-200">🔮 Маг</span>
          <span class="text-[10px] text-amber-400 code-font">100 🪙</span>
        </button>
      </div>
    </div>
    <!-- Upgrade Base -->
    <button onclick="upgradeBase('blue')" id="btnUpgradeBlue" class="w-full py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-lg shadow-blue-900/40 transition">
      Улучшить базу (<span id="blueUpgradeCost">150</span> 🪙)
    </button>
    <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1">
      <span>Авто-спавн ИИ:</span>
      <input type="checkbox" id="blueAiToggle" checked class="accent-blue-500 w-4 h-4 cursor-pointer">
    </div>
  </aside>

  <!-- Right Sidebar: Red Base Management -->
  <aside class="absolute right-3 top-20 z-10 w-64 bg-slate-900/85 backdrop-blur-md p-3.5 rounded-2xl border border-red-500/30 shadow-2xl space-y-3 pointer-events-auto transition-all">
    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
      <h3 class="font-bold text-red-400 flex items-center gap-1.5 text-sm">
        ⚔️ База Красных <span id="redBaseLevel" class="text-xs bg-red-950 border border-red-700 text-red-300 px-1.5 py-0.5 rounded">Ув. 1</span>
      </h3>
      <span id="redGoldText" class="text-amber-400 font-bold text-xs code-font">🪙 0</span>
    </div>
    <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800">
      <div id="redHpBar" class="bg-red-500 h-full transition-all duration-300" style="width: 100%;"></div>
    </div>
    <!-- Spawner controls -->
    <div class="space-y-1.5">
      <div class="text-[11px] font-semibold text-slate-400">ПРИЗВАТЬ ЮНИТА:</div>
      <div class="grid grid-cols-2 gap-1.5 text-xs">
        <button onclick="manualSpawn('red', 'melee')" class="p-2 rounded-lg bg-slate-800 hover:bg-red-900/50 border border-slate-700 hover:border-red-500 text-left transition flex flex-col">
          <span class="font-bold text-slate-200">⚔️ Мечник</span>
          <span class="text-[10px] text-amber-400 code-font">20 🪙</span>
        </button>
        <button onclick="manualSpawn('red', 'archer')" class="p-2 rounded-lg bg-slate-800 hover:bg-red-900/50 border border-slate-700 hover:border-red-500 text-left transition flex flex-col">
          <span class="font-bold text-slate-200">🏹 Лучник</span>
          <span class="text-[10px] text-amber-400 code-font">35 🪙</span>
        </button>
        <button onclick="manualSpawn('red', 'tank')" class="p-2 rounded-lg bg-slate-800 hover:bg-red-900/50 border border-slate-700 hover:border-red-500 text-left transition flex flex-col">
          <span class="font-bold text-slate-200">🛡️ Гигант</span>
          <span class="text-[10px] text-amber-400 code-font">75 🪙</span>
        </button>
        <button onclick="manualSpawn('red', 'mage')" class="p-2 rounded-lg bg-slate-800 hover:bg-red-900/50 border border-slate-700 hover:border-red-500 text-left transition flex flex-col">
          <span class="font-bold text-slate-200">🔮 Маг</span>
          <span class="text-[10px] text-amber-400 code-font">100 🪙</span>
        </button>
      </div>
    </div>
    <!-- Upgrade Base -->
    <button onclick="upgradeBase('red')" id="btnUpgradeRed" class="w-full py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs shadow-lg shadow-red-900/40 transition">
      Улучшить базу (<span id="redUpgradeCost">150</span> 🪙)
    </button>
    <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1">
      <span>Авто-спавн ИИ:</span>
      <input type="checkbox" id="redAiToggle" checked class="accent-red-500 w-4 h-4 cursor-pointer">
    </div>
  </aside>

  <!-- Bottom Helper Bar / Spawn Brush Tools -->
  <div class="absolute bottom-3 left-1/2 -translate-x-1/2 z-20 bg-slate-900/90 backdrop-blur-md p-2 rounded-2xl border border-slate-700/60 shadow-2xl flex items-center gap-3 px-4 text-xs">
    <div class="flex items-center gap-1.5 text-slate-300 font-semibold">
      <span>🖱️ Управление:</span>
      <span class="text-slate-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">Зажми ПКМ / Перетаскивание — Камера</span>
      <span class="text-slate-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">Колёсико — Зум</span>
    </div>
    <div class="h-4 w-[1px] bg-slate-700"></div>
    <!-- Spawn Tool selector -->
    <div class="flex items-center gap-1">
      <span class="text-slate-400 text-[11px]">Спавн кликом:</span>
      <select id="godModeFaction" class="bg-slate-800 border border-slate-700 text-slate-200 rounded px-2 py-1 focus:outline-none">
        <option value="none">Выкл (Только камера)</option>
        <option value="blue">Синий Мечник</option>
        <option value="red">Красный Мечник</option>
      </select>
    </div>
  </div>

  <!-- Bottom Right Minimap -->
  <div class="absolute bottom-3 right-3 z-20 bg-slate-900/90 backdrop-blur-md p-1.5 rounded-2xl border border-slate-700/60 shadow-2xl pointer-events-auto">
    <canvas id="minimapCanvas" width="180" height="110" class="rounded-xl border border-slate-800 bg-slate-950 cursor-pointer"></canvas>
  </div>

  <!-- Canvas World -->
  <canvas id="gameCanvas" class="w-full h-full cursor-grab active:cursor-grabbing"></canvas>

  <script>
    // Global Constants & Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimapCanvas');
    const miniCtx = minimapCanvas.getContext('2d');

    // World Dimensions (Large Sandbox Map)
    const WORLD = { width: 3600, height: 2200 };

    // Game Simulation State
    let speedMultiplier = 1;
    let isPaused = false;
    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 60;
    let soundEnabled = true;

    // Camera Object
    const camera = {
      x: WORLD.width / 2 - window.innerWidth / 2,
      y: WORLD.height / 2 - window.innerHeight / 2,
      zoom: 0.8,
      minZoom: 0.35,
      maxZoom: 2.2,
      isDragging: false,
      dragStart: { x: 0, y: 0 }
    };

    // Web Audio API Sound Generator (No external MP3 files required)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }

    function playSound(type) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'hit') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'shoot') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'magic') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(800, now + 0.2);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'gold') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.setValueAtTime(1200, now + 0.05);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      } catch (e) { console.error(e); }
    }

    // Spatial Hash Grid for O(N) Collision & Target Finding
    class SpatialGrid {
      constructor(cellSize) {
        this.cellSize = cellSize;
        this.grid = new Map();
      }
      clear() {
        this.grid.clear();
      }
      getKey(x, y) {
        const cx = Math.floor(x / this.cellSize);
        const cy = Math.floor(y / this.cellSize);
        return `${cx},${cy}`;
      }
      insert(unit) {
        const key = this.getKey(unit.x, unit.y);
        if (!this.grid.has(key)) this.grid.set(key, []);
        this.grid.get(key).push(unit);
      }
      getNearby(x, y, radius) {
        const minCx = Math.floor((x - radius) / this.cellSize);
        const maxCx = Math.floor((x + radius) / this.cellSize);
        const minCy = Math.floor((y - radius) / this.cellSize);
        const maxCy = Math.floor((y + radius) / this.cellSize);
        const results = [];
        for (let cx = minCx; cx <= maxCx; cx++) {
          for (let cy = minCy; cy <= maxCy; cy++) {
            const list = this.grid.get(`${cx},${cy}`);
            if (list) {
              for (let i = 0; i < list.length; i++) results.push(list[i]);
            }
          }
        }
        return results;
      }
    }
    const spatialGrid = new SpatialGrid(120);

    // Visual Effects Particle System
    const particles = [];
    const floatTexts = [];

    function addParticle(x, y, color, count = 5) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          size: Math.random() * 3 + 2,
          color,
          life: 1.0,
          decay: Math.random() * 0.04 + 0.02
        });
      }
    }

    function addFloatingText(x, y, text, color) {
      floatTexts.push({
        x, y,
        text, color,
        life: 1.0,
        vy: -1.2
      });
    }

    // Base & Tower Definitions
    class Base {
      constructor(id, faction, x, y, color) {
        this.id = id;
        this.faction = faction; // 'blue', 'red', 'neutral'
        this.x = x;
        this.y = y;
        this.radius = 80;
        this.color = color;
        this.hp = 1000;
        this.maxHp = 1000;
        this.level = 1;
        this.gold = 100;
        this.upgradeCost = 150;
        this.spawnTimer = 0;
        this.spawnInterval = 180; // frames
        this.aiEnabled = true;
      }

      update() {
        // Income passive
        if (frameCount % 60 === 0) {
          this.gold += 5 + this.level * 2;
        }

        // Auto Spawner AI
        if (this.aiEnabled && this.faction !== 'neutral') {
          this.spawnTimer++;
          if (this.spawnTimer >= Math.max(60, this.spawnInterval - this.level * 15)) {
            this.spawnTimer = 0;
            this.aiSpawnDecision();
          }

          // Auto Upgrade AI
          if (this.gold >= this.upgradeCost && Math.random() < 0.01) {
            upgradeBase(this.faction);
          }
        }
      }

      aiSpawnDecision() {
        // AI chooses unit depending on gold
        const rand = Math.random();
        if (this.gold >= 100 && rand > 0.75) {
          spawnUnit(this.faction, 'mage', this.x, this.y);
          this.gold -= 100;
        } else if (this.gold >= 75 && rand > 0.55) {
          spawnUnit(this.faction, 'tank', this.x, this.y);
          this.gold -= 75;
        } else if (this.gold >= 35 && rand > 0.3) {
          spawnUnit(this.faction, 'archer', this.x, this.y);
          this.gold -= 35;
        } else if (this.gold >= 20) {
          spawnUnit(this.faction, 'melee', this.x, this.y);
          this.gold -= 20;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Base Aura / Circle
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.faction === 'blue' ? 'rgba(59, 130, 246, 0.15)' : 
                        this.faction === 'red' ? 'rgba(239, 68, 68, 0.15)' : 'rgba(234, 179, 8, 0.15)';
        ctx.fill();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 4;
        ctx.stroke();

        // Fortress Core Icon Structure
        ctx.fillStyle = this.color;
        ctx.fillRect(-30, -30, 60, 60);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-20, -20, 40, 40);

        // Tower Roof
        ctx.beginPath();
        ctx.moveTo(-35, -30);
        ctx.lineTo(0, -60);
        ctx.lineTo(35, -30);
        ctx.closePath();
        ctx.fillStyle = this.color;
        ctx.fill();

        // Level text
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px Outfit';
        ctx.textAlign = 'center';
        ctx.fillText(`LVL ${this.level}`, 0, 5);

        // HP Bar
        ctx.restore();
        const barW = 100;
        const barH = 8;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        ctx.fillRect(this.x - barW / 2, this.y - this.radius - 15, barW, barH);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - barW / 2, this.y - this.radius - 15, barW * (Math.max(0, this.hp) / this.maxHp), barH);
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.strokeRect(this.x - barW / 2, this.y - this.radius - 15, barW, barH);
      }
    }

    // Capture Gold Mines in middle
    class GoldMine {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 45;
        this.owner = 'neutral'; // 'blue', 'red', 'neutral'
        this.captureProgress = 0; // -100 (Red) to +100 (Blue)
      }

      update(units) {
        // Count nearby units from both teams
        const nearby = spatialGrid.getNearby(this.x, this.y, this.radius + 30);
        let blueNear = 0;
        let redNear = 0;

        for (let u of nearby) {
          const dist = Math.hypot(u.x - this.x, u.y - this.y);
          if (dist <= this.radius + 30) {
            if (u.faction === 'blue') blueNear++;
            if (u.faction === 'red') redNear++;
          }
        }

        if (blueNear > redNear) {
          this.captureProgress = Math.min(100, this.captureProgress + 1);
        } else if (redNear > blueNear) {
          this.captureProgress = Math.max(-100, this.captureProgress - 1);
        }

        if (this.captureProgress >= 100) this.owner = 'blue';
        else if (this.captureProgress <= -100) this.owner = 'red';

        // Provide Gold to Owner
        if (frameCount % 90 === 0 && this.owner !== 'neutral') {
          const ownerBase = this.owner === 'blue' ? bases.blue : bases.red;
          ownerBase.gold += 12;
          addFloatingText(this.x, this.y - 20, '+12 🪙', '#f59e0b');
          playSound('gold');
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.owner === 'blue' ? 'rgba(59, 130, 246, 0.2)' :
                        this.owner === 'red' ? 'rgba(239, 68, 68, 0.2)' : 'rgba(234, 179, 8, 0.15)';
        ctx.fill();
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Mine icon
        ctx.fillStyle = '#f59e0b';
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🪙', 0, -5);

        // Progress meter
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-25, 20, 50, 6);
        ctx.fillStyle = this.captureProgress > 0 ? '#3b82f6' : '#ef4444';
        ctx.fillRect(0, 20, (this.captureProgress / 100) * 25, 6);

        ctx.restore();
      }
    }

    // Unit Types Data Blueprint
    const UNIT_TYPES = {
      melee: { hp: 120, speed: 2.2, range: 25, attack: 14, cooldown: 45, radius: 10, color: '#60a5fa' },
      archer: { hp: 70, speed: 2.5, range: 180, attack: 18, cooldown: 65, radius: 8, color: '#34d399' },
      tank: { hp: 350, speed: 1.3, range: 30, attack: 28, cooldown: 70, radius: 16, color: '#a78bfa' },
      mage: { hp: 80, speed: 1.8, range: 150, attack: 22, cooldown: 90, radius: 9, color: '#f472b6', splash: true }
    };

    // Main Stickman / Soldier Unit Class
    class Unit {
      constructor(id, faction, type, x, y) {
        this.id = id;
        this.faction = faction;
        this.type = type;
        const config = UNIT_TYPES[type];
        this.hp = config.hp;
        this.maxHp = config.hp;
        this.speed = config.speed + (Math.random() * 0.4 - 0.2);
        this.range = config.range;
        this.attack = config.attack;
        this.cooldownMax = config.cooldown;
        this.cooldown = Math.floor(Math.random() * config.cooldown);
        this.radius = config.radius;

        this.x = x + (Math.random() * 60 - 30);
        this.y = y + (Math.random() * 60 - 30);
        this.vx = 0;
        this.vy = 0;
        this.target = null;
        this.animPhase = Math.random() * Math.PI * 2;
      }

      update() {
        this.animPhase += 0.15;
        if (this.cooldown > 0) this.cooldown--;

        // Find Target via Spatial Grid
        this.findTarget();

        let moveTargetX = this.faction === 'blue' ? bases.red.x : bases.blue.x;
        let moveTargetY = this.faction === 'blue' ? bases.red.y : bases.blue.y;

        if (this.target) {
          moveTargetX = this.target.x;
          moveTargetY = this.target.y;
        }

        // Distance to target
        const dx = moveTargetX - this.x;
        const dy = moveTargetY - this.y;
        const dist = Math.hypot(dx, dy);

        // Attack Logic
        if (this.target && dist <= this.range + this.target.radius) {
          if (this.cooldown <= 0) {
            this.executeAttack();
            this.cooldown = this.cooldownMax;
          }
        } else {
          // Steering towards target
          if (dist > 0) {
            this.vx += (dx / dist) * 0.3;
            this.vy += (dy / dist) * 0.3;
          }
        }

        // Separation (Flocking - push away nearby friendly units)
        const neighbors = spatialGrid.getNearby(this.x, this.y, this.radius * 2.5);
        for (let other of neighbors) {
          if (other !== this) {
            const sx = this.x - other.x;
            const sy = this.y - other.y;
            const sDist = Math.hypot(sx, sy);
            const minDist = this.radius + other.radius + 2;
            if (sDist > 0 && sDist < minDist) {
              const force = (minDist - sDist) / minDist;
              this.vx += (sx / sDist) * force * 0.5;
              this.vy += (sy / sDist) * force * 0.5;
            }
          }
        }

        // Apply Drag / Limit Max Speed
        const currentSpeed = Math.hypot(this.vx, this.vy);
        if (currentSpeed > this.speed) {
          this.vx = (this.vx / currentSpeed) * this.speed;
          this.vy = (this.vy / currentSpeed) * this.speed;
        }

        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.85;
        this.vy *= 0.85;

        // Map Boundary Constraints
        this.x = Math.max(50, Math.min(WORLD.width - 50, this.x));
        this.y = Math.max(50, Math.min(WORLD.height - 50, this.y));
      }

      findTarget() {
        const searchRadius = 350;
        const candidates = spatialGrid.getNearby(this.x, this.y, searchRadius);
        let closestDist = Infinity;
        let bestTarget = null;

        for (let unit of candidates) {
          if (unit.faction !== this.faction && unit.hp > 0) {
            const d = Math.hypot(unit.x - this.x, unit.y - this.y);
            if (d < searchRadius && d < closestDist) {
              closestDist = d;
              bestTarget = unit;
            }
          }
        }

        // If no units, target enemy base
        if (!bestTarget) {
          const enemyBase = this.faction === 'blue' ? bases.red : bases.blue;
          const dBase = Math.hypot(enemyBase.x - this.x, enemyBase.y - this.y);
          if (dBase < searchRadius + 200) {
            bestTarget = enemyBase;
          }
        }

        this.target = bestTarget;
      }

      executeAttack() {
        if (!this.target) return;

        if (this.type === 'melee' || this.type === 'tank') {
          // Direct Hit
          this.target.hp -= this.attack;
          addParticle(this.target.x, this.target.y, this.faction === 'blue' ? '#60a5fa' : '#f87171', 4);
          addFloatingText(this.target.x, this.target.y - 10, `-${this.attack}`, '#ffffff');
          playSound('hit');
        } else if (this.type === 'archer') {
          // Spawn Arrow Projectile
          projectiles.push(new Projectile(this.x, this.y, this.target, this.attack, 'arrow', this.faction));
          playSound('shoot');
        } else if (this.type === 'mage') {
          // Spawn Spell Fireball Projectile
          projectiles.push(new Projectile(this.x, this.y, this.target, this.attack, 'fireball', this.faction));
          playSound('magic');
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        const bodyColor = this.faction === 'blue' ? '#3b82f6' : '#ef4444';
        const outlineColor = this.faction === 'blue' ? '#1d4ed8' : '#b91c1c';

        // Animated walking bobbing offset
        const bob = Math.sin(this.animPhase) * (Math.hypot(this.vx, this.vy) > 0.2 ? 3 : 0);

        // Shadow
        ctx.beginPath();
        ctx.ellipse(0, 5, this.radius * 0.9, this.radius * 0.4, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fill();

        // Stickman / Unit Body Circle
        ctx.beginPath();
        ctx.arc(0, -bob, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = bodyColor;
        ctx.fill();
        ctx.strokeStyle = outlineColor;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Weapon graphic
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 2;
        if (this.type === 'melee' || this.type === 'tank') {
          // Sword / Club
          ctx.beginPath();
          ctx.moveTo(this.radius * 0.5, -bob);
          ctx.lineTo(this.radius * 1.5, -bob - 8);
          ctx.stroke();
        } else if (this.type === 'archer') {
          // Bow
          ctx.beginPath();
          ctx.arc(this.radius * 0.8, -bob, 8, -Math.PI / 2, Math.PI / 2);
          ctx.stroke();
        } else if (this.type === 'mage') {
          // Staff with Glowing Orb
          ctx.beginPath();
          ctx.moveTo(this.radius * 0.5, -bob);
          ctx.lineTo(this.radius * 1.2, -bob - 12);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(this.radius * 1.2, -bob - 12, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#ec4899';
          ctx.fill();
        }

        // HP Bar above unit
        if (this.hp < this.maxHp) {
          const barW = this.radius * 2.2;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.fillRect(-barW / 2, -this.radius - 12 - bob, barW, 4);
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(-barW / 2, -this.radius - 12 - bob, barW * (this.hp / this.maxHp), 4);
        }

        ctx.restore();
      }
    }

    // Flying Projectiles (Arrows, Fireballs)
    class Projectile {
      constructor(x, y, target, damage, type, faction) {
        this.x = x;
        this.y = y;
        this.target = target;
        this.damage = damage;
        this.type = type;
        this.faction = faction;
        this.speed = type === 'arrow' ? 7 : 4.5;
        this.hit = false;
      }

      update() {
        if (!this.target || this.target.hp <= 0) {
          this.hit = true;
          return;
        }

        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist <= 10) {
          // Impact
          this.target.hp -= this.damage;
          this.hit = true;

          if (this.type === 'fireball') {
            // Splash Damage AOE
            const splashTargets = spatialGrid.getNearby(this.x, this.y, 60);
            for (let u of splashTargets) {
              if (u.faction !== this.faction && u !== this.target) {
                u.hp -= this.damage * 0.5;
              }
            }
            addParticle(this.x, this.y, '#f59e0b', 12);
          } else {
            addParticle(this.x, this.y, '#e2e8f0', 3);
          }
          addFloatingText(this.target.x, this.target.y - 12, `-${this.damage}`, '#f87171');
        } else {
          this.x += (dx / dist) * this.speed;
          this.y += (dy / dist) * this.speed;
        }
      }

      draw() {
        ctx.save();
        if (this.type === 'arrow') {
          ctx.fillStyle = '#e2e8f0';
          ctx.beginPath();
          ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // Global Collections
    let units = [];
    let projectiles = [];
    let bases = {};
    let mines = [];

    // Initialize Game Field
    function initGame() {
      units = [];
      projectiles = [];
      particles.length = 0;
      floatTexts.length = 0;

      bases = {
        blue: new Base('blue_base', 'blue', 300, WORLD.height / 2, '#3b82f6'),
        red: new Base('red_base', 'red', WORLD.width - 300, WORLD.height / 2, '#ef4444')
      };

      mines = [
        new GoldMine(WORLD.width / 2, WORLD.height / 2 - 350),
        new GoldMine(WORLD.width / 2, WORLD.height / 2),
        new GoldMine(WORLD.width / 2, WORLD.height / 2 + 350)
      ];

      // Initial Army Wave
      for (let i = 0; i < 6; i++) {
        spawnUnit('blue', 'melee', bases.blue.x + 80, bases.blue.y);
        spawnUnit('red', 'melee', bases.red.x - 80, bases.red.y);
      }
    }

    function spawnUnit(faction, type, x, y) {
      const id = Math.random().toString(36).substr(2, 9);
      units.push(new Unit(id, faction, type, x, y));
    }

    // Manual UI Trigger Handlers
    window.manualSpawn = function(faction, type) {
      initAudio();
      const base = bases[faction];
      const cost = UNIT_TYPES[type].hp > 200 ? 75 : UNIT_TYPES[type].range > 100 ? 35 : 20;
      if (base.gold >= cost) {
        base.gold -= cost;
        spawnUnit(faction, type, base.x + (faction === 'blue' ? 60 : -60), base.y);
      } else {
        addFloatingText(base.x, base.y - 40, 'Не хватает золота!', '#ef4444');
      }
    };

    window.upgradeBase = function(faction) {
      initAudio();
      const base = bases[faction];
      if (base.gold >= base.upgradeCost) {
        base.gold -= base.upgradeCost;
        base.level++;
        base.maxHp += 400;
        base.hp += 400;
        base.upgradeCost = Math.floor(base.upgradeCost * 1.8);
        addFloatingText(base.x, base.y - 50, `База Уровень ${base.level}!`, '#38bdf8');
        playSound('gold');
      }
    };

    // Camera Controls & Input Handling
    canvas.addEventListener('mousedown', (e) => {
      initAudio();
      const godMode = document.getElementById('godModeFaction').value;

      if (godMode !== 'none' && e.button === 0) {
        // Spawn Unit at World Position
        const worldPos = screenToWorld(e.clientX, e.clientY);
        spawnUnit(godMode, 'melee', worldPos.x, worldPos.y);
        return;
      }

      if (e.button === 2 || e.button === 0) {
        camera.isDragging = true;
        camera.dragStart.x = e.clientX;
        camera.dragStart.y = e.clientY;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (camera.isDragging) {
        const dx = e.clientX - camera.dragStart.x;
        const dy = e.clientY - camera.dragStart.y;
        camera.x -= dx / camera.zoom;
        camera.y -= dy / camera.zoom;
        camera.dragStart.x = e.clientX;
        camera.dragStart.y = e.clientY;
      }
    });

    window.addEventListener('mouseup', () => camera.isDragging = false);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // Mouse Zoom
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newZoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * zoomFactor));

      // Zoom towards mouse position
      const mouseWorldBefore = screenToWorld(e.clientX, e.clientY);
      camera.zoom = newZoom;
      const mouseWorldAfter = screenToWorld(e.clientX, e.clientY);

      camera.x += (mouseWorldBefore.x - mouseWorldAfter.x);
      camera.y += (mouseWorldBefore.y - mouseWorldAfter.y);
    }, { passive: false });

    function screenToWorld(sx, sy) {
      return {
        x: (sx / camera.zoom) + camera.x,
        y: (sy / camera.zoom) + camera.y
      };
    }

    // Touch Support for Mobile
    let lastTouchDist = 0;
    canvas.addEventListener('touchstart', (e) => {
      initAudio();
      if (e.touches.length === 1) {
        camera.isDragging = true;
        camera.dragStart.x = e.touches[0].clientX;
        camera.dragStart.y = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        lastTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && camera.isDragging) {
        const dx = e.touches[0].clientX - camera.dragStart.x;
        const dy = e.touches[0].clientY - camera.dragStart.y;
        camera.x -= dx / camera.zoom;
        camera.y -= dy / camera.zoom;
        camera.dragStart.x = e.touches[0].clientX;
        camera.dragStart.y = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / lastTouchDist;
        camera.zoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * factor));
        lastTouchDist = dist;
      }
    });

    canvas.addEventListener('touchend', () => camera.isDragging = false);

    // UI Buttons Binding
    document.getElementById('btnPause').addEventListener('click', () => {
      isPaused = !isPaused;
      document.getElementById('pauseIcon').innerText = isPaused ? '▶' : '⏸';
      document.getElementById('pauseText').innerText = isPaused ? 'Старт' : 'Пауза';
    });

    document.getElementById('btnRestart').addEventListener('click', initGame);

    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.replace('bg-indigo-600', 'text-slate-400'));
        e.target.classList.add('bg-indigo-600');
        e.target.classList.remove('text-slate-400');
        speedMultiplier = parseInt(e.target.innerText);
      });
    });

    document.getElementById('btnSound').addEventListener('click', (e) => {
      soundEnabled = !soundEnabled;
      e.target.innerText = soundEnabled ? '🔊 Sound' : '🔇 Mute';
    });

    // Resize Handler
    function handleResize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', handleResize);
    handleResize();

    function drawGridTerrain() {
      // Battlefield Grass Terrain Grid
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, WORLD.width, WORLD.height);

      ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
      ctx.lineWidth = 1;
      const gridSize = 100;
      for (let x = 0; x < WORLD.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, WORLD.height);
        ctx.stroke();
      }
      for (let y = 0; y < WORLD.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WORLD.width, y);
        ctx.stroke();
      }

      // Battlefield Middle Division Line
      ctx.strokeStyle = 'rgba(234, 179, 8, 0.2)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(WORLD.width / 2, 0);
      ctx.lineTo(WORLD.width / 2, WORLD.height);
      ctx.stroke();
    }

    function renderMinimap() {
      miniCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
      const scaleX = minimapCanvas.width / WORLD.width;
      const scaleY = minimapCanvas.height / WORLD.height;

      // Draw Bases
      miniCtx.fillStyle = '#3b82f6';
      miniCtx.fillRect(bases.blue.x * scaleX - 4, bases.blue.y * scaleY - 4, 8, 8);
      miniCtx.fillStyle = '#ef4444';
      miniCtx.fillRect(bases.red.x * scaleX - 4, bases.red.y * scaleY - 4, 8, 8);

      // Draw Units
      for (let u of units) {
        miniCtx.fillStyle = u.faction === 'blue' ? '#60a5fa' : '#f87171';
        miniCtx.fillRect(u.x * scaleX, u.y * scaleY, 2, 2);
      }

      // Camera Box
      miniCtx.strokeStyle = '#f59e0b';
      miniCtx.lineWidth = 1.5;
      miniCtx.strokeRect(
        camera.x * scaleX,
        camera.y * scaleY,
        (window.innerWidth / camera.zoom) * scaleX,
        (window.innerHeight / camera.zoom) * scaleY
      );
    }

    function updateUI() {
      // Sync checkbox AI settings
      bases.blue.aiEnabled = document.getElementById('blueAiToggle').checked;
      bases.red.aiEnabled = document.getElementById('redAiToggle').checked;

      // Counters
      const blueUnits = units.filter(u => u.faction === 'blue').length;
      const redUnits = units.filter(u => u.faction === 'red').length;

      document.getElementById('blueCountText').innerText = blueUnits;
      document.getElementById('redCountText').innerText = redUnits;

      document.getElementById('blueGoldText').innerText = `🪙 ${bases.blue.gold}`;
      document.getElementById('redGoldText').innerText = `🪙 ${bases.red.gold}`;

      document.getElementById('blueBaseLevel').innerText = `Ув. ${bases.blue.level}`;
      document.getElementById('redBaseLevel').innerText = `Ув. ${bases.red.level}`;

      document.getElementById('blueHpBar').style.width = `${Math.max(0, (bases.blue.hp / bases.blue.maxHp) * 100)}%`;
      document.getElementById('redHpBar').style.width = `${Math.max(0, (bases.red.hp / bases.red.maxHp) * 100)}%`;

      document.getElementById('blueUpgradeCost').innerText = bases.blue.upgradeCost;
      document.getElementById('redUpgradeCost').innerText = bases.red.upgradeCost;
    }

    // Main Game Frame Loop
    function gameLoop(now) {
      const dt = now - lastTime;
      lastTime = now;
      frameCount++;

      if (frameCount % 30 === 0) {
        fps = Math.round(1000 / dt);
        document.getElementById('fpsText').innerText = fps;
      }

      if (!isPaused) {
        // Multi-speed sub-stepping
        for (let step = 0; step < speedMultiplier; step++) {
          // 1. Clear & rebuild Spatial Grid
          spatialGrid.clear();
          for (let u of units) spatialGrid.insert(u);

          // 2. Update Bases & Mines
          bases.blue.update();
          bases.red.update();
          for (let m of mines) m.update(units);

          // 3. Update Units
          for (let i = units.length - 1; i >= 0; i--) {
            const u = units[i];
            u.update();
            if (u.hp <= 0) {
              addParticle(u.x, u.y, u.faction === 'blue' ? '#3b82f6' : '#ef4444', 8);
              units.splice(i, 1);
            }
          }

          // 4. Update Projectiles
          for (let i = projectiles.length - 1; i >= 0; i--) {
            const p = projectiles[i];
            p.update();
            if (p.hit) projectiles.splice(i, 1);
          }

          // 5. Update Particles
          for (let i = particles.length - 1; i >= 0; i--) {
            const pt = particles[i];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.life -= pt.decay;
            if (pt.life <= 0) particles.splice(i, 1);
          }

          // 6. Update Floating Text
          for (let i = floatTexts.length - 1; i >= 0; i--) {
            const ft = floatTexts[i];
            ft.y += ft.vy;
            ft.life -= 0.025;
            if (ft.life <= 0) floatTexts.splice(i, 1);
          }
        }
      }

      // RENDER PASS
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Apply Camera Viewport Matrix
      ctx.save();
      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(-camera.x, -camera.y);

      // World Background
      drawGridTerrain();

      // Render Mines & Bases
      for (let m of mines) m.draw();
      bases.blue.draw();
      bases.red.draw();

      // Render Units
      for (let u of units) u.draw();

      // Render Projectiles
      for (let p of projectiles) p.draw();

      // Render Particles
      for (let pt of particles) {
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      // Render Floating Text
      for (let ft of floatTexts) {
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = ft.life;
        ctx.font = 'bold 13px JetBrains Mono';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.globalAlpha = 1.0;
      }

      ctx.restore();

      // UI Overlays & Minimap
      updateUI();
      renderMinimap();

      requestAnimationFrame(gameLoop);
    }

    // Launch Application
    initGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
