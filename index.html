<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RKCPlay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
@property --c{syntax:'<color>';inherits:true;initial-value:#1c3a8a}
:root{--txt:#f2f5ff;--dim:#9aa6c8;--tile:clamp(110px,18vw,180px);--gap:clamp(14px,2.4vw,26px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#05070f;color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;--c:#1c3a8a;transition:--c .6s ease;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#bg{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 105%,var(--c) 0%,transparent 62%),linear-gradient(180deg,#05070f,#0a1230)}
#waves{position:fixed;left:-10%;right:-10%;bottom:-6%;height:55%;opacity:.5;pointer-events:none}
#waves path{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1.2}
#waves g{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(-4%)}}
#top{position:fixed;z-index:3;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 22px 0;font-weight:300}
#brand{font-size:15px;letter-spacing:.04em;color:var(--dim)}
#tools{display:flex;align-items:center;gap:6px}
#tools button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.08);font-size:17px;transition:background .2s}
#tools button:hover,#tools button:focus-visible{background:rgba(255,255,255,.22);outline:none}
#clock{font-size:20px;font-variant-numeric:tabular-nums;margin-left:10px}
#tabs{position:fixed;z-index:3;left:0;right:0;top:calc(env(safe-area-inset-top) + 66px);display:flex;gap:6px;justify-content:center;overflow-x:auto;padding:4px 16px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;padding:8px 16px;border:0;border-radius:999px;background:transparent;color:var(--dim);font-size:15px;font-weight:300;transition:color .2s,background .2s}
#tabs button.on{color:#fff;background:rgba(255,255,255,.15);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
#stage{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:center;padding-top:50px}
#track{display:flex;gap:var(--gap);align-items:center;padding:0 50vw;width:max-content;transition:transform .38s cubic-bezier(.2,.8,.2,1);height:calc(var(--tile)*1.6)}
.tile{width:var(--tile);height:var(--tile);flex:none;border-radius:22%;position:relative;cursor:pointer;display:grid;place-items:center;overflow:hidden;opacity:.62;transform:scale(.92);box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s,box-shadow .3s}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 45%)}
.ico{font-size:calc(var(--tile)*.46);filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));position:relative}
.tile.sel{opacity:1;transform:scale(1.32);box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 46px 6px var(--c),0 22px 44px rgba(0,0,0,.55)}
.tile.sel::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:shine 2.6s .4s ease-out 1 forwards}
@keyframes shine{to{transform:translateX(120%)}}
.nw{position:absolute;left:8%;top:8%;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:#fff;color:#0a1230}
.st{position:absolute;right:9%;top:6%;font-size:18px;color:#ffd84a;display:none;text-shadow:0 1px 4px #000}
.tile.isfav .st{display:block}
#info{text-align:center;padding:0 24px;margin-top:calc(var(--tile)*.38);min-height:150px}
#info h2{margin:0;font-size:clamp(26px,4.4vw,40px);font-weight:300}
#info p{margin:6px 0 4px;color:var(--dim);font-size:clamp(14px,2vw,17px);font-weight:300}
#meta{display:flex;gap:18px;justify-content:center;color:var(--dim);font-size:13px;min-height:18px;margin-bottom:12px}
#acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{padding:11px 30px;border-radius:999px;border:0;font-size:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);transition:background .2s,color .2s}
.pill:hover,.pill:focus-visible{background:#fff;color:#0a1230;outline:none}
#favb{padding:11px 18px;color:#ffd84a}
#hints{position:fixed;z-index:2;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;justify-content:center;gap:22px;color:var(--dim);font-size:12.5px;font-weight:300;flex-wrap:wrap;padding:0 90px}
#count{position:fixed;z-index:2;right:22px;bottom:calc(env(safe-area-inset-bottom) + 14px);color:var(--dim);font-size:13px}
@media(max-width:700px){#hints span:nth-child(n+3){display:none}#hints{padding:0 80px}}

#splash{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(100% 70% at 50% 100%,#1c3a8a,#05070f 70%);transition:opacity .7s}
#splash.off{opacity:0;pointer-events:none}
#splash h1{margin:0;font-size:clamp(40px,9vw,92px);font-weight:200;letter-spacing:.12em}
#splash p{margin:0;color:var(--dim);font-weight:300;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.pan{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(3,5,12,.82);backdrop-filter:blur(8px)}
.pan.on{display:flex}
.box{width:min(460px,92vw);max-height:84vh;overflow:auto;background:rgba(20,26,50,.92);border-radius:22px;padding:20px 22px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.box h3{margin:0 0 4px;font-weight:300;font-size:24px}
.box small{color:var(--dim)}
.tr{display:flex;gap:14px;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,.08)}
.tr:first-of-type{margin-top:12px}
.tr i{font-style:normal;font-size:28px}
.tr.lock{opacity:.4;filter:grayscale(1)}
.tr b{display:block;font-weight:600;font-size:15px}.tr span{color:var(--dim);font-size:13px}
.box h4{margin:16px 0 6px;font-size:13px;font-weight:600;color:var(--dim)}
.box p{margin:8px 0;font-weight:300;line-height:1.5}
.box ul{margin:0;padding-left:18px;font-weight:300;line-height:1.55;font-size:14px}
.dh{height:92px;border-radius:16px;display:grid;place-items:center;font-size:48px;margin-bottom:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12.5px}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.st2{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:14px}
.st2 b{color:var(--txt);font-weight:600}
#toast{position:fixed;z-index:40;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-140%);display:flex;gap:12px;align-items:center;padding:12px 20px;border-radius:16px;background:rgba(18,24,46,.96);box-shadow:0 0 0 1px rgba(255,255,255,.18),0 12px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#toast.on{transform:translate(-50%,0)}
#toast i{font-style:normal;font-size:30px}#toast b{display:block;font-size:15px}#toast span{font-size:13px;color:var(--dim)}

#player{position:fixed;inset:0;z-index:10;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#player.on{opacity:1;pointer-events:auto}
#player iframe{width:100%;height:100%;border:0;background:#000}
#back{position:fixed;z-index:11;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;backdrop-filter:blur(6px);opacity:0;pointer-events:none;touch-action:none;transition:opacity .3s,left .2s}
#back.on{opacity:.38;pointer-events:auto}
#back.on:hover,#back.on.drag{opacity:1}
#back.drag{transition:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.av{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.12);font-size:30px;flex:none;vertical-align:middle}
#bProf .av{width:30px;height:30px;font-size:17px;background:none}
#coinb{font-size:14px;margin-left:8px;color:#ffd84a;white-space:nowrap}
.box input{width:100%;padding:11px 14px;margin:4px 0;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;font:inherit;user-select:text}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.bar i{display:block;height:100%;background:#ffd84a}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:12px 0}
.it{border-radius:14px;background:rgba(255,255,255,.07);padding:10px 4px;text-align:center;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:96px;justify-content:center}
.it.on{outline:2px solid #ffd84a}.it small{color:var(--dim)}
.pill.sel{background:#fff;color:#0a1230}
#bDev.off{opacity:.45}
.lk{position:absolute;left:8%;bottom:8%;font-size:16px}
.tile.nodev{filter:saturate(.25) brightness(.8)}
@media(pointer:coarse){#hints{display:none}.tile{--tile:clamp(120px,30vw,170px)}}
@media(max-width:700px){#bShop,#bTro,#bMute,#bFs{display:none}#top{padding:calc(env(safe-area-inset-top) + 10px) 12px 0}#tools button{width:42px;height:42px}#tools{gap:4px}
 #clock{display:none}#tabs{top:calc(env(safe-area-inset-top) + 62px)}#tabs button{padding:10px 16px;font-size:16px}
 .pill{padding:13px 26px}#info{min-height:170px}#count{right:14px}
 .pan{align-items:flex-end}.box{width:100vw;max-height:88vh;border-radius:22px 22px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px)}}

#afk{position:fixed;inset:0;z-index:35;background:rgba(2,4,10,.78);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(20px,6vw,90px);opacity:0;pointer-events:none;transition:opacity 1.2s}
#afk.on{opacity:1;pointer-events:auto}
#afk .fc{width:min(380px,86vw);padding:22px 24px;border-radius:22px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);backdrop-filter:blur(10px);transition:opacity .6s,transform .6s}
#afk .fc.out{opacity:0;transform:translateY(10px)}
#afk .fi{font-size:40px;margin-bottom:6px}
#afk .fl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
#afk .ft{margin-top:6px;font-size:clamp(20px,3vw,26px);font-weight:300;line-height:1.3}
#afk .fz{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);text-align:center;color:var(--dim);font-size:13px;font-weight:300}
@media(max-width:700px){#afk{align-items:flex-end;justify-content:center;padding-bottom:90px}}

#brand{background:none;border:0;padding:6px 12px;margin-left:-12px;border-radius:999px;font-size:16px;font-weight:400;letter-spacing:.04em;color:var(--txt);transition:background .2s}
#brand:hover,#brand:focus-visible{background:rgba(255,255,255,.14);outline:none}
#hints{display:none!important}
.mi{display:flex;gap:14px;align-items:center;width:100%;padding:12px 4px;border:0;border-top:1px solid rgba(255,255,255,.08);background:none;text-align:left;font-size:16px}
.mi:first-of-type{border-top:0}.mi:hover,.mi:focus-visible{background:rgba(255,255,255,.07);outline:none}.mi i{font-style:normal;font-size:24px;width:30px;text-align:center}
.mset{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0}
.mset .row{margin:0}.mset .pill{padding:7px 14px;font-size:14px}
.mft{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);text-align:center;color:var(--dim);font-size:13px;font-weight:300}
.mft b{display:block;color:var(--txt);font-size:15px;font-weight:400;letter-spacing:.06em;margin-bottom:2px}
.mft button{background:none;border:0;color:var(--dim);text-decoration:underline;font-size:13px;margin-top:6px}
body.tsS{--tile:clamp(88px,13vw,135px)}body.tsL{--tile:clamp(135px,23vw,225px)}
body.tsS .tile,body.tsL .tile{--tile:inherit}
body.rm *{transition:none!important;animation:none!important}
.tos h4{color:var(--txt);margin:14px 0 2px}.tos p{margin:2px 0;font-size:14px;color:#c9d2ee}
#season{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:background 1s}
#season span{position:absolute;top:0;opacity:.55;animation:sfall linear infinite;will-change:transform}
@keyframes sfall{from{transform:translate(0,-12vh) rotate(0)}to{transform:translate(var(--dx),112vh) rotate(360deg)}}
body.rm #season span{display:none}
@media(prefers-reduced-motion:reduce){#season span{display:none}}

/* ===== ДОСТИЖЕНИЯ PLAYSTATION-СТИЛЬ ===== */
.tile .plat{position:absolute;right:8%;bottom:8%;font-size:15px;filter:drop-shadow(0 2px 4px #000);z-index:2}
.ach-hero{display:flex;gap:16px;align-items:center;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(167,139,250,.28),rgba(50,60,110,.42));box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);margin-bottom:12px}
.ach-hero .ah-big{font-size:44px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.ach-hero b{font-size:17px}
.ach-hero .ah-sub{font-size:12.5px;color:var(--dim);margin-top:2px}
.ach-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}
.ach-bar i{display:block;height:100%;background:linear-gradient(90deg,#a78bfa,#ffd84a);transition:width .4s}
.ach-list{margin-top:4px}
.ach-row{display:flex;gap:12px;align-items:flex-start;padding:11px 6px;border-top:1px solid rgba(255,255,255,.07)}
.ach-row:first-child{border-top:0}
.ach-row.locked{opacity:.45;filter:grayscale(.85)}
.ach-row.plat{background:linear-gradient(90deg,rgba(167,139,250,.14),transparent);border-radius:10px}
.ach-row .ar-ic{font-size:26px;width:34px;text-align:center;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.ach-row.plat .ar-ic{font-size:30px}
.ach-row .ar-b{flex:1;min-width:0}
.ach-row .ar-b b{display:block;font-size:14.5px;font-weight:600}
.ach-row .ar-b span{display:block;font-size:12.5px;color:var(--dim);margin-top:1px}
.ach-row .ar-meta{font-size:11.5px;color:var(--dim);margin-top:3px}
#achtrophy{position:fixed;z-index:44;right:16px;bottom:calc(env(safe-area-inset-bottom) + 60px);display:flex;gap:14px;align-items:center;padding:13px 18px;border-radius:16px;background:linear-gradient(135deg,#1e2444,#0a0e20);box-shadow:0 0 0 1px rgba(255,255,255,.16),0 18px 46px rgba(0,0,0,.6);transform:translateX(calc(100% + 40px));transition:transform .55s cubic-bezier(.2,.8,.2,1);max-width:min(400px,92vw);pointer-events:none}
#achtrophy.on{transform:translateX(0)}
#achtrophy .at-ico{font-size:36px;filter:drop-shadow(0 0 12px rgba(255,255,255,.3))}
#achtrophy .at-lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
#achtrophy .at-name{font-size:16px;font-weight:600;margin-top:1px}
#achtrophy .at-desc{font-size:12.5px;color:var(--dim);margin-top:1px}
@media(max-width:700px){#achtrophy{right:10px;left:10px;max-width:none;bottom:calc(env(safe-area-inset-bottom) + 66px)}}
</style>
</head>
<body>
<div id="bg"></div>
<svg id="waves" viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true"><g>
<path d="M0 200C200 120 400 280 600 200S1000 120 1200 200"/><path d="M0 240C200 160 400 320 600 240S1000 160 1200 240"/><path d="M0 280C200 200 400 360 600 280S1000 200 1200 280"/><path d="M0 320C200 240 400 400 600 320S1000 240 1200 320"/></g></svg>

<div id="season" aria-hidden="true"></div>
<div id="top"><button id="brand" aria-label="Меню RKCPlay">RKCPlay ▾</button>
<div id="tools"><button id="bDice" aria-label="Случайная игра" title="Случайная игра (R)">🎲</button><button id="bDev" aria-label="Фильтр устройства"></button><button id="bShop" aria-label="Магазин" title="Магазин (S)">🛒</button><button id="bProf" aria-label="Профиль" title="Профиль (P)">👤</button><button id="bTro" aria-label="Трофеи" title="Трофеи (T)">🏆</button><button id="bMute" aria-label="Звук" title="Звук (M)">🔊</button><button id="bFs" aria-label="Во весь экран" title="Во весь экран">⛶</button><span id="coinb"></span><span id="clock"></span></div></div>
<nav id="tabs" aria-label="Разделы"></nav>

<div id="stage">
<div id="track" role="listbox" aria-label="Игры"></div>
<div id="info"><h2 id="title"></h2><p id="desc"></p><div id="meta"></div>
<div id="acts"><button class="pill" id="play">Играть</button><button class="pill" id="moreb">Подробнее</button><button class="pill" id="favb" aria-label="В избранное" title="В избранное (F)">☆</button></div></div>
</div>
<div id="hints"><span>◀ ▶ игра</span><span>▲ ▼ раздел</span><span>Enter играть</span><span>I подробнее</span><span>F избранное</span><span>R рулетка</span><span>T трофеи</span></div>
<div id="count"></div>

<div id="menuP" class="pan"><div id="menuBox" class="box"></div></div>
<div id="tosP" class="pan"><div id="tosBox" class="box"></div></div>
<div id="troP" class="pan"><div id="troBox" class="box"></div></div>
<div id="detP" class="pan"><div id="detBox" class="box"></div></div>
<div id="profP" class="pan"><div id="profBox" class="box"></div></div>
<div id="shopP" class="pan"><div id="shopBox" class="box"></div></div>
<div id="lbP" class="pan"><div id="lbBox" class="box"></div></div>
<div id="achP" class="pan"><div id="achBox" class="box"></div></div>
<input type="file" id="pfile" accept="application/json,.json" hidden>
<div id="toast"><i></i><div><b></b><span></span></div></div>
<div id="achtrophy"><i class="at-ico"></i><div><div class="at-lbl"></div><div class="at-name"></div><div class="at-desc"></div></div></div>
<div id="afk" aria-hidden="true"><div class="fc" id="afkCard"><div class="fi"></div><div class="fl"></div><div class="ft"></div></div><div class="fz">Нажми любую кнопку</div></div>
<div id="splash"><h1>RKCPlay</h1><p>Нажми любую кнопку</p></div>

<button id="back" aria-label="В меню" title="В меню. Кнопку можно перетащить">⌂</button>
<div id="player"><iframe id="frame" allow="fullscreen; autoplay; gamepad"></iframe></div>

<script>
// ====== СПИСОК ИГР ======
const GAMES=[
 {title:"Dead by Canvas",file:"games/dead-by-canvas.html",emoji:"🔦",desc:"Выживание от маньяка в тёмном лесу",cat:"horror",c:"#d0432f",c2:"#3a0d0d",new:true,dev:["kb","touch"],
  info:"Тёмный лес, маньяк и пять генераторов. Почини три из них и беги к воротам на востоке. Прячься в кустах, роняй палетки и не промахивайся мимо красной зоны.",
  how:["WASD или стрелки — бег, Shift — красться","E — удерживай, чтобы чинить генератор, нажми, чтобы уронить палетку","Пробел или клик — попасть в красную зону проверки навыка","На телефоне: джойстик, кнопка действия и тап по экрану для проверки"],
  ach:[
    {id:'gen1',  n:'Первый ток',  d:'Почини первый генератор',                    t:'bronze'},
    {id:'gen3',  n:'Электрик',    d:'Почини все три генератора',                   t:'silver'},
    {id:'escape',n:'Побег',       d:'Сбеги через ворота',                          t:'gold'},
    {id:'no_hit',n:'Неуязвимый',  d:'Сбеги, ни разу не попавшись маньяку',          t:'gold'}
  ]},

 {title:"Обломов: Беги, Илья Ильич!",file:"games/oblomov-run.html",dev:["kb","touch"],emoji:"🛋️",desc:"Забег по мотивам романа",cat:"arcade",c:"#9bbf4c",c2:"#3b4a2a",new:true,

// ---------- звук ----------
let AC;
function snd(f,d=.08,type='sine',at=0,v=.06){if(ST.mute)return;
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+at;
 o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sMove=()=>snd(520,.05,'triangle'),sOk=()=>{snd(660,.1);snd(880,.16,'sine',.08)},sBack=()=>{snd(440,.08);snd(330,.12,'sine',.07)};
const chime=()=>[784,988,1319].forEach((f,i)=>snd(f,.35,'sine',i*.11,.07));
const boot=()=>[262,330,392,523].forEach((f,i)=>snd(f,.9,'sine',i*.13,.05));
function sndTrophy(t){
 const seq=t==='plat'?[[523,.14],[659,.14],[784,.14],[1047,.42]]
          :t==='gold'?[[659,.13],[880,.28]]
          :[[587,.12],[784,.22]];
 seq.forEach(([f,d],i)=>snd(f,d,'triangle',i*.1,.09));
}

// ---------- трофеи сайта и уведомления ----------
const q=[];let showing=false;
function toast(i,b,s){q.push([i,b,s]);if(!showing)pump()}
function pump(){const n=q.shift();if(!n){showing=false;return}showing=true;const t=$('toast');
 t.querySelector('i').textContent=n[0];t.querySelector('b').textContent=n[1];t.querySelector('span').textContent=n[2];
 t.classList.add('on');setTimeout(()=>{t.classList.remove('on');setTimeout(pump,380)},3200)}
function award(id){if(ST.tro[id])return;ST.tro[id]=Date.now();earn(25);const t=TRO.find(x=>x[0]===id);toast(t[1],'Трофей: '+t[2],t[3]);chime();
 if(id!=='plat'&&TRO.every(x=>x[0]==='plat'||ST.tro[x[0]]))setTimeout(()=>award('plat'),1500)}
function check(){const n=GAMES.filter(g=>ST.stats[g.file]&&ST.stats[g.file].n).length;if(n>=1)award('first');if(n>=3)award('three');if(n>=GAMES.length)award('all')}

// ---------- ДОСТИЖЕНИЯ ПО ИГРАМ ----------
function gameAch(file){
 const g=GAMES.find(x=>x.file===file);
 if(!g||!Array.isArray(g.ach)||!g.ach.length)return [];
 return [{id:'__plat',n:'Платина',d:'Получи все остальные достижения в игре',t:'plat',plat:true},...g.ach];
}
const achUnlocked=(file,id)=>!!(ST.ach&&ST.ach[file]&&ST.ach[file][id]);
const platDone=file=>achUnlocked(file,'__plat');
function achDone(file){return gameAch(file).filter(a=>achUnlocked(file,a.id)).length}
function achTotalGlobal(){
 let total=0,done=0,plats=0;
 GAMES.forEach(g=>{
  const a=gameAch(g.file);if(!a.length)return;
  total+=a.length;
  done+=a.filter(x=>achUnlocked(g.file,x.id)).length;
  if(platDone(g.file))plats++;
 });
 return {total,done,plats};
}
function achToast(a,file){
 const g=GAMES.find(x=>x.file===file);
 const el=$('achtrophy');
 el.querySelector('.at-ico').textContent=TTYPE[a.t]?.ico||'🏆';
 el.querySelector('.at-lbl').textContent='Достижение · '+(TTYPE[a.t]?.label||'');
 el.querySelector('.at-name').textContent=a.n;
 el.querySelector('.at-desc').textContent=(g?g.title+' · ':'')+a.d;
 el.classList.add('on');
 clearTimeout(achToast.t);
 achToast.t=setTimeout(()=>el.classList.remove('on'),4200);
 sndTrophy(a.t);
}
function unlockAch(id){
 if(!inGame||!curFile)return false;
 const a=gameAch(curFile).find(x=>x.id===id);
 if(!a||a.plat||achUnlocked(curFile,id))return false;
 ST.ach[curFile]=ST.ach[curFile]||{};
 ST.ach[curFile][id]=Date.now();
 const reward=a.t==='bronze'?5:a.t==='silver'?10:25;
 earn(reward);save();achToast(a,curFile);
 const others=gameAch(curFile).filter(x=>!x.plat);
 if(others.every(x=>achUnlocked(curFile,x.id))&&!platDone(curFile)){
  ST.ach[curFile]['__plat']=Date.now();
  save();
  setTimeout(()=>{achToast(gameAch(curFile)[0],curFile);earn(100)},1600);
 }
 return true;
}
function progressAch(id,cur){
 if(!inGame||!curFile)return;
 const a=gameAch(curFile).find(x=>x.id===id);
 if(!a||!a.max||achUnlocked(curFile,id))return;
 ST.achp[curFile]=ST.achp[curFile]||{};
 ST.achp[curFile][id]=Math.max(ST.achp[curFile][id]||0,Math.min(a.max,+cur||0));
 save();
 if(ST.achp[curFile][id]>=a.max)unlockAch(id);
}
function achPanel(file){
 if(!file)file=S.list[S.cur]?.file;
 if(!file)return;
 const g=GAMES.find(x=>x.file===file);
 if(!g)return;
 const a=gameAch(file);
 if(!a.length){
  $('achBox').innerHTML=`<h3>🏆 Достижения</h3><small>${esc(g.title)}</small><p style="margin-top:16px;color:var(--dim)">У этой игры пока нет достижений. Как только автор их добавит, они появятся здесь.</p><div class="row"><button class="pill" id="acClose">Закрыть</button></div>`;
 }else{
  const done=achDone(file),total=a.length,pct=Math.round(done/total*100),plats=platDone(file);
  const rows=a.map(x=>{
   const un=achUnlocked(file,x.id);
   const ts=un?new Date(ST.ach[file][x.id]).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}):'';
   const prog=!un&&x.max&&ST.achp?.[file]?.[x.id]?` · ${ST.achp[file][x.id]}/${x.max}`:'';
   return `<div class="ach-row ${x.plat?'plat':''} ${un?'':'locked'}">
     <div class="ar-ic">${TTYPE[x.t].ico}</div>
     <div class="ar-b"><b>${esc(x.n)}</b><span>${esc(x.d)}${prog}</span>
     <div class="ar-meta">${un?'🏆 Получено '+ts:'🔒 Не получено'}</div></div>
   </div>`;
  }).join('');
  $('achBox').innerHTML=`
   <h3>🏆 Достижения</h3><small>${esc(g.title)}</small>
   <div class="ach-hero" style="margin-top:12px">
     <div class="ah-big">${plats?'🏆':'🎯'}</div>
     <div style="flex:1;min-width:0">
       <b>${done} из ${total}</b>
       <div class="ah-sub">${plats?'🏆 Платина получена':pct+'% · до платины '+(total-done)+' шт.'}</div>
       <div class="ach-bar"><i style="width:${pct}%"></i></div>
     </div>
   </div>
   <div class="ach-list">${rows}</div>
   <div class="row"><button class="pill" id="acPlay">Играть</button><button class="pill" id="acClose">Закрыть</button></div>`;
  $('acPlay').onclick=()=>{closePans();openGame(file,true)};
 }
 $('acClose').onclick=closePans;
 $('achP').classList.add('on');snd(600,.1);
}

 if(data.achp)for(const f in data.achp){if(!files.has(f))continue;ST.achp[f]=ST.achp[f]||{};for(const id in data.achp[f])ST.achp[f][id]=Math.max(ST.achp[f][id]||0,num(data.achp[f][id]))}
 save();await push();setCat(S.cat)}
async function lb(){$('lbBox').innerHTML='<h3>Рейтинг</h3><small>Загрузка…</small>';$('lbP').classList.add('on');
 const{data,error}=await sb.rpc('rkc_leaderboard');
 $('lbBox').innerHTML='<h3>Рейтинг</h3><small>Топ-20 по опыту</small>'+(error?'<p>Не удалось загрузить</p>':(data||[]).map((r,i)=>`<div class="tr">${avh(r.avatar,r.frame,40)}<div><b>${i+1}. ${esc(r.nickname)}</b><span>${esc(r.title||'без титула')} · Ур. ${lvl(r.xp)}</span></div></div>`).join('')||'<p>Пока никого</p>')+'<div class="row"><button class="pill" id="lClose">Закрыть</button></div>';
 $('lClose').onclick=closePans}
if(sb)sb.auth.onAuthStateChange((ev,sess)=>{user=sess?sess.user:null;authReady=true;if(pendingAuth){const[f,p]=pendingAuth;pendingAuth=null;setTimeout(()=>openGame(f,p),0)}setTimeout(async()=>{if(user)await pull().catch(()=>{});if($('profP').classList.contains('on'))profile();refreshTop()},0)});
devBtn();refreshTop();

const tick=()=>$('clock').textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
tick();setInterval(tick,15000);

buildTabs();setCat('all');
const lastG=GAMES.filter(g=>ST.stats[g.file]&&ST.stats[g.file].last).sort((a,b)=>ST.stats[b.file].last-ST.stats[a.file].last)[0];
if(lastG)select(Math.max(0,S.list.indexOf(lastG)));
if(location.hash.length>1&&GAMES.some(g=>g.file===decodeURIComponent(location.hash.slice(1)))){$('splash').classList.add('off');fromHash()}

// ---------- АФК-экран ----------
const afkEl=$('afk'),afkCard=$('afkCard');let afkOn=false,afkT=0,afkI=0,afkF=[],afkRot=0;
const afkLimit=()=>(ST.afkSec===undefined?60:ST.afkSec)*1000;
function afkFacts(){const f=[],st=ST.stats,top=GAMES.filter(g=>st[g.file]&&st[g.file].t>=6e4).sort((a,b)=>st[b.file].t-st[a.file].t)[0];
 if(top)f.push(['⏱️','Твоя статистика',fmt(st[top.file].t)+' в «'+top.title+'»']);
 const n=Object.values(st).reduce((a,x)=>a+(x.n||0),0);if(n)f.push(['🚀','Твоя статистика','Запусков за всё время: '+n]);
 f.push(['🪙','Профиль','Уровень '+lvl(ST.xp)+', монет: '+ST.coins]);
 const A=achTotalGlobal();if(A.total)f.push(['🏆','Достижения','Получено '+A.done+' из '+A.total+(A.plats?' · платин: '+A.plats:'')]);
 const tg=TRO.filter(t=>ST.tro[t[0]]).length;f.push(['🏅','Трофеи сайта','Получено '+tg+' из '+TRO.length]);
 [['◀ ▶ или колесо мыши — выбрать игру','🎮'],['Enter — играть, I — подробнее','⌨️'],['F — в избранное, R — случайная игра','🎲'],['▲ ▼ — переключить раздел','↕️'],['Кнопку ⌂ в игре можно перетащить','⌂']].forEach(h=>f.push([h[1],'Подсказка',h[0]]));
 GAMES.filter(g=>!(st[g.file]&&st[g.file].n)).sort(()=>Math.random()-.5).slice(0,3).forEach(g=>f.push([g.emoji,'Ты ещё не запускал','«'+g.title+'» — '+g.desc]));
 return f.sort(()=>Math.random()-.5)}
function afkShow(){const x=afkF[afkI++%afkF.length];afkCard.classList.add('out');
 setTimeout(()=>{afkCard.children[0].textContent=x[0];afkCard.children[1].textContent=x[1];afkCard.children[2].textContent=x[2];afkCard.classList.remove('out')},afkOn&&afkI>1?600:0)}
function afkStart(){if(afkOn||inGame||!$('splash').classList.contains('off'))return;afkOn=true;afkF=afkFacts();afkI=0;afkEl.classList.add('on');afkEl.setAttribute('aria-hidden','false');afkShow();afkRot=setInterval(afkShow,6000)}
function poke(){clearTimeout(afkT);if(!inGame&&afkLimit())afkT=setTimeout(afkStart,afkLimit())}
function afkStop(){if(!afkOn)return false;afkOn=false;clearInterval(afkRot);afkEl.classList.remove('on');afkEl.setAttribute('aria-hidden','true');gl=performance.now()+400;return true}
['keydown','pointerdown','touchstart','wheel'].forEach(t=>addEventListener(t,e=>{if(afkStop()){e.stopImmediatePropagation();if(e.cancelable)e.preventDefault()}poke()},{capture:true,passive:false}));
addEventListener('pointermove',()=>{if(!afkOn)poke()},{passive:true});
(function afkPad(){const p=(navigator.getGamepads?[...navigator.getGamepads()]:[]).find(Boolean);
 if(p&&(p.buttons.some(b=>b.pressed)||Math.abs(p.axes[0]||0)>.6||Math.abs(p.axes[1]||0)>.6)){afkStop();poke()}requestAnimationFrame(afkPad)})();
new MutationObserver(poke).observe(player,{attributes:true,attributeFilter:['class']});poke();

// ---------- меню ----------
function applyPrefs(){document.body.classList.remove('tsS','tsL');if(ST.tileSz==='s')document.body.classList.add('tsS');if(ST.tileSz==='l')document.body.classList.add('tsL');
 document.body.classList.toggle('rm',!!ST.rm);applySeason();if(!inGame)select(S.cur)}
const MENU_KEYS=['◀ ▶ — выбрать игру','▲ ▼ — раздел','Enter — играть','I — подробнее','F — избранное','R — случайная игра','T — трофеи сайта','S — магазин','P — профиль','M — звук','Q — это меню'];
function menu(on){const p=$('menuP');if(on===undefined)on=!p.classList.contains('on');if(!on){p.classList.remove('on');snd(420,.1);return}
 const opt=(k,items,cur)=>items.map(x=>`<button class="pill${String(cur)===String(x[0])?' sel':''}" data-set="${k}:${x[0]}">${x[1]}</button>`).join('');
 const afk=ST.afkSec===undefined?60:ST.afkSec;
 $('menuBox').innerHTML=`<h3>RKCPlay</h3><small>Игры, профиль и настройки</small>
 <div style="margin-top:10px"><button class="mi" data-go="shop"><i>🛒</i>Магазин</button><button class="mi" data-go="prof"><i>👤</i>Профиль</button><button class="mi" data-go="tro"><i>🏆</i>Трофеи сайта</button>${sb?'<button class="mi" data-go="lb"><i>🏅</i>Рейтинг</button>':''}</div>
 <h4>Настройки</h4>
 <div class="mset"><span>Звук</span><div class="row">${opt('snd',[[1,'Вкл'],[0,'Выкл']],ST.mute?0:1)}</div></div>
 <div class="mset"><span>Размер плиток</span><div class="row">${opt('tile',[['s','Мелкие'],['m','Средние'],['l','Крупные']],ST.tileSz||'m')}</div></div>
 <div class="mset"><span>Меньше анимаций</span><div class="row">${opt('rm',[[1,'Да'],[0,'Нет']],ST.rm?1:0)}</div></div>
 <div class="mset"><span>АФК-экран через</span><div class="row">${opt('afk',[[30,'30 с'],[60,'1 мин'],[180,'3 мин'],[0,'Никогда']],afk)}</div></div>
 <div class="mset"><span>Сезонный режим</span><div class="row">${opt('season',[['auto','Авто'],['off','Выкл'],['halloween','🎃'],['winter','❄️'],['love','💗'],['spring','🌸']],ST.season||'auto')}</div></div>
 <h4>Управление</h4><ul>${MENU_KEYS.map(k=>'<li>'+k+'</li>').join('')}</ul>
 <div class="row"><button class="pill" id="mClose">Закрыть</button></div>
 <div class="mft"><b>RKC Studio</b>Студия-разработчик RKCPlay<br><button id="mTos">Пользовательское соглашение</button></div>`;
 const B=$('menuBox');
 B.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;closePans();({shop:()=>shop(true),prof:profile,tro:()=>troPanel(true),lb}[g])()});
 B.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const[k,v]=b.dataset.set.split(':');
  if(k==='snd'){ST.mute=v==='0';$('bMute').textContent=ST.mute?'🔇':'🔊'}else if(k==='tile')ST.tileSz=v;else if(k==='rm')ST.rm=v==='1';else if(k==='afk'){ST.afkSec=+v;poke()}else if(k==='season')ST.season=v;
  save();applyPrefs();menu(true);if(k==='snd'&&!ST.mute)sOk()});
 $('mClose').onclick=()=>menu(false);$('mTos').onclick=tos;p.classList.add('on');snd(600,.1)}
function tos(){closePans();$('tosBox').innerHTML=`<div class="tos"><h3>Пользовательское соглашение RKC</h3><small>Редакция от 29 октября 2026</small>
 <h4>1. Что это</h4><p>RKCPlay — закрытая коллекция игр студии RKC. Её делает автор для себя и друзей.</p>
 <h4>2. Доступ</h4><p>Доступ только по ссылке от RKC.</p>
 <h4>3. Профиль и данные</h4><p>Ник, аватар, прогресс, монеты, достижения и статистика хранятся на твоём устройстве. При входе в аккаунт они копируются в облако (Supabase).</p>
 <h4>4. Правила поведения</h4><p>Без оскорбительных ников и накрутки. За нарушение RKC может обнулить профиль.</p>
 <h4>5. Монеты и предметы</h4><p>Все предметы виртуальные и не стоят денег.</p>
 <h4>6. Игры</h4><p>Игры работают «как есть». В хоррор-играх бывают пугающие сцены.</p>
 <h4>7. Удаление данных</h4><p>Очисти данные сайта в браузере, чтобы стереть локальный профиль.</p>
 <h4>8. Изменения</h4><p>Соглашение может обновляться.</p>
 <div class="row"><button class="pill" id="tBack">← В меню</button><button class="pill" id="tClose">Закрыть</button></div></div>`;
 $('tBack').onclick=()=>{closePans();menu(true)};$('tClose').onclick=closePans;$('tosP').classList.add('on');snd(600,.1)}
// ---------- сезонные режимы ----------
const SEASONS={
 halloween:{name:'Хэллоуин',ico:'🎃',p:['🎃','🦇','👻','🕸️'],a:'rgba(255,110,20,.30)',b:'rgba(130,50,210,.24)',r:[1020,1102],hi:'Жуткий месяц в RKCPlay'},
 winter:{name:'Зима',ico:'❄️',p:['❄️','❄️','✨','⛄'],a:'rgba(120,190,255,.24)',b:'rgba(210,235,255,.10)',r:[1201,110],hi:'В RKCPlay пошёл снег'},
 love:{name:'День святого Валентина',ico:'💗',p:['💗','💕','🌹'],a:'rgba(255,80,140,.26)',b:'rgba(255,170,190,.12)',r:[208,215],hi:'Сердечки в RKCPlay'},
 spring:{name:'Весна',ico:'🌸',p:['🌸','🌷','🍃'],a:'rgba(255,150,190,.20)',b:'rgba(120,220,140,.14)',r:[301,515],hi:'В RKCPlay расцвела весна'}};
function seasonId(){const m=ST.season||'auto';if(m==='off')return null;if(SEASONS[m])return m;
 const d=new Date(),md=(d.getMonth()+1)*100+d.getDate();
 return Object.keys(SEASONS).find(k=>{const r=SEASONS[k].r;return r[0]<=r[1]?md>=r[0]&&md<=r[1]:md>=r[0]||md<=r[1]})||null}
function applySeason(){const el=$('season'),id=seasonId(),S0=SEASONS[id],h1=$('splash').querySelector('h1');
 el.innerHTML='';el.style.background='none';$('brand').textContent=(S0?S0.ico+' ':'')+'RKCPlay ▾';h1.textContent=(S0?S0.ico+' ':'')+'RKCPlay';if(!S0)return;
 el.style.background=`radial-gradient(90% 60% at 50% 0%,${S0.a},transparent 70%),radial-gradient(80% 50% at 100% 100%,${S0.b},transparent 70%)`;
 for(let i=0;i<20;i++){const sp=document.createElement('span'),r=Math.random;sp.textContent=S0.p[i%S0.p.length];
  sp.style.cssText=`left:${r()*100}%;font-size:${14+r()*18|0}px;animation-duration:${9+r()*9}s;animation-delay:-${r()*16}s;--dx:${(r()-.5)*160}px`;el.appendChild(sp)}}
function seasonHello(){const id=seasonId();if(!id)return;const k=id+new Date().getFullYear();if(ST.seasonSeen===k)return;ST.seasonSeen=k;save();
 setTimeout(()=>toast(SEASONS[id].ico,SEASONS[id].name,SEASONS[id].hi),2000)}
$('brand').onclick=()=>menu();applyPrefs();seasonHello();
</script>
