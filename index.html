<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сборник игр</title>
<style>
  @property --c { syntax:'<color>'; inherits:true; initial-value:#1c3a8a; }
  :root { --txt:#f2f5ff; --dim:#9aa6c8; --tile:clamp(118px,19vw,190px); --gap:clamp(14px,2.4vw,26px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; overflow:hidden; }
  body { background:#05070f; color:var(--txt); font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
         --c:#1c3a8a; transition:--c .6s ease; user-select:none; }

  /* фон: тёмный градиент и волна цвета выбранной игры */
  #bg { position:fixed; inset:0; z-index:0;
        background:radial-gradient(120% 80% at 50% 105%, var(--c) 0%, transparent 62%),
                   linear-gradient(180deg,#05070f 0%,#0a1230 55%,#0a1230 100%); }
  #waves { position:fixed; left:-10%; right:-10%; bottom:-6%; height:55%; z-index:0; opacity:.5; pointer-events:none; }
  #waves path { fill:none; stroke:rgba(255,255,255,.14); stroke-width:1.2; }
  #waves g { animation:drift 14s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:translateX(-4%); } }

  #top { position:fixed; z-index:2; left:0; right:0; top:0; display:flex; justify-content:space-between; align-items:center;
         padding:calc(env(safe-area-inset-top) + 18px) 28px 0; font-weight:300; }
  #brand { font-size:15px; letter-spacing:.04em; color:var(--dim); }
  #clock { font-size:22px; font-variant-numeric:tabular-nums; }

  #stage { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; justify-content:center; }
  #track { display:flex; gap:var(--gap); align-items:center; padding:0 50vw; width:max-content;
           transition:transform .38s cubic-bezier(.2,.8,.2,1); will-change:transform; height:calc(var(--tile)*1.6); }
  .tile { width:var(--tile); height:var(--tile); flex:none; border-radius:22%; position:relative; cursor:pointer;
          display:grid; place-items:center; overflow:hidden; opacity:.62; transform:scale(.92);
          box-shadow:0 10px 30px rgba(0,0,0,.45);
          transition:transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s, box-shadow .3s; }
  .tile::before { content:""; position:absolute; inset:0; background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 45%); }
  .tile .ico { font-size:calc(var(--tile)*.46); filter:drop-shadow(0 6px 10px rgba(0,0,0,.4)); position:relative; }
  .tile.sel { opacity:1; transform:scale(1.32);
              box-shadow:0 0 0 3px rgba(255,255,255,.95), 0 0 46px 6px var(--c), 0 22px 44px rgba(0,0,0,.55); }
  .tile.sel::after { content:""; position:absolute; inset:0; border-radius:inherit;
                     background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);
                     transform:translateX(-120%); animation:shine 2.6s .4s ease-out 1 forwards; }
  @keyframes shine { to { transform:translateX(120%); } }

  #info { text-align:center; padding:0 24px; margin-top:calc(var(--tile)*.38); min-height:130px; }
  #info h2 { margin:0; font-size:clamp(26px,4.4vw,40px); font-weight:300; letter-spacing:.01em; }
  #info p { margin:6px 0 16px; color:var(--dim); font-size:clamp(14px,2vw,17px); font-weight:300; }
  #play { padding:11px 34px; border-radius:999px; border:0; font:inherit; font-size:16px; cursor:pointer;
          background:rgba(255,255,255,.14); color:#fff; backdrop-filter:blur(8px);
          box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5); transition:background .2s, color .2s; }
  #play:hover,#play:focus-visible { background:#fff; color:#0a1230; outline:none; }

  #hints { position:fixed; z-index:2; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 16px);
           display:flex; justify-content:center; gap:26px; color:var(--dim); font-size:13px; font-weight:300; }
  #count { position:fixed; z-index:2; right:28px; bottom:calc(env(safe-area-inset-bottom) + 16px); color:var(--dim); font-size:13px; }
  @media (max-width:600px) { #hints span:nth-child(n+2) { display:none; } }

  #player { position:fixed; inset:0; z-index:10; background:#000; opacity:0; pointer-events:none; transition:opacity .35s; }
  #player.on { opacity:1; pointer-events:auto; }
  #player iframe { width:100%; height:100%; border:0; background:#000; }
  #back { position:fixed; z-index:11; top:calc(env(safe-area-inset-top) + 8px); left:8px; padding:8px 14px; border-radius:999px;
          border:0; background:rgba(0,0,0,.6); color:#fff; font:inherit; font-size:14px; opacity:0; pointer-events:none;
          backdrop-filter:blur(6px); transition:opacity .35s; }
  #back.on { opacity:.75; pointer-events:auto; }
  #back:hover { opacity:1; }

  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<div id="bg"></div>
<svg id="waves" viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true">
  <g>
    <path d="M0 200 C200 120 400 280 600 200 S1000 120 1200 200"/>
    <path d="M0 240 C200 160 400 320 600 240 S1000 160 1200 240"/>
    <path d="M0 280 C200 200 400 360 600 280 S1000 200 1200 280"/>
    <path d="M0 320 C200 240 400 400 600 320 S1000 240 1200 320"/>
  </g>
</svg>

<div id="top"><div id="brand">RKC Studio</div><div id="clock"></div></div>

<div id="stage">
  <div id="track" role="listbox" aria-label="Игры"></div>
  <div id="info"><h2 id="title"></h2><p id="desc"></p><button id="play">Играть</button></div>
</div>

<div id="hints"><span>◀ ▶ выбрать игру</span><span>Enter — играть</span><span>Esc — вернуться в меню</span></div>
<div id="count"></div>

<button id="back">← Меню</button>
<div id="player"><iframe id="frame" allow="fullscreen; autoplay; gamepad"></iframe></div>

<script>
// ====== СПИСОК ИГР — добавляй сюда новые строки ======
// file — путь к хтмлке относительно этого index.html; c, c2 — цвета плитки
const GAMES = [
  { title: "Спагетти-Спидран", file: "games/spaghetti-speedrun.html", emoji: "🍝", desc: "Платформер-спидран", c: "#ff8a3d", c2: "#c2331f" },
  { title: "Отель «Закат»", file: "games/hotel-maze.html", emoji: "🏨", desc: "Хоррор, ночная смена", c: "#8a3dff", c2: "#2a0f5e" },
  { title: "Казик «Блябуду Рояль»", file: "games/kazik-neo.html", emoji: "🎰", desc: "Слоты, шахматы, мины", c: "#ffcf33", c2: "#b3260f" },
  { title: "Battle Simulator", file: "games/battle-simulator.html", emoji: "⚔️", desc: "Красные против Синих", c: "#3d7bff", c2: "#d62f3f" },
  { title: "Мозаика", file: "games/mozaika-match3.html", emoji: "💎", desc: "Три в ряд", c: "#2fd6c4", c2: "#2a56c9" },
  { title: "Мафия · ИИ за столом", file: "games/mafia-gm.html", emoji: "🕵️", desc: "Ведущий для игры с ИИ", c: "#c23a5a", c2: "#25122a" },
  { title: "Симулятор электрощитка", file: "games/electric-panel.html", emoji: "⚡", desc: "Щёлкай автоматы", c: "#ffe033", c2: "#4a5a6e" },
  { title: "XIZUS: The Final Cut", file: "games/xizus.html", emoji: "🗄️", desc: "Проверка документов", c: "#6b8cae", c2: "#1d2733" },
  { title: "Xizus vs Faerg", file: "games/xizus-vs-faerg-td.html", emoji: "🛡️", desc: "Tower defense (v5)", c: "#43c466", c2: "#14502e" },
];
// =====================================================

const $ = id => document.getElementById(id);
const track = $('track'), player = $('player'), frame = $('frame'), back = $('back');
let cur = 0, inGame = false;

GAMES.forEach((g, i) => {
  const t = document.createElement('div');
  t.className = 'tile'; t.setAttribute('role', 'option');
  t.style.background = `linear-gradient(150deg, ${g.c}, ${g.c2})`;
  t.innerHTML = `<span class="ico">${g.emoji}</span>`;
  t.onclick = () => (i === cur ? launch() : select(i));
  track.appendChild(t);
});
const tiles = [...track.children];

function select(i) {
  cur = (i + GAMES.length) % GAMES.length;
  const g = GAMES[cur];
  tiles.forEach((t, k) => { t.classList.toggle('sel', k === cur); t.setAttribute('aria-selected', k === cur); });
  const t = tiles[cur];
  track.style.transform = `translateX(${innerWidth / 2 - (t.offsetLeft + t.offsetWidth / 2)}px)`;
  document.body.style.setProperty('--c', g.c);
  $('title').textContent = g.title;
  $('desc').textContent = g.desc;
  $('count').textContent = `${cur + 1} из ${GAMES.length}`;
}

function openGame(file, push) {
  frame.src = file;
  player.classList.add('on'); back.classList.add('on'); inGame = true;
  if (push) history.pushState({ game: file }, '', '#' + encodeURIComponent(file));
  frame.onload = () => { try { frame.focus(); } catch (e) {} };
}
function closeGame() {
  player.classList.remove('on'); back.classList.remove('on'); inGame = false;
  setTimeout(() => { if (!inGame) frame.src = 'about:blank'; }, 380);
}
function launch() { openGame(GAMES[cur].file, true); }

// открывать можно только игры из списка GAMES
function fromHash() {
  const f = location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : '';
  const i = GAMES.findIndex(g => g.file === f);
  if (i >= 0) { select(i); openGame(f, false); } else if (inGame) closeGame();
}

back.onclick = () => history.back();
$('play').onclick = launch;
addEventListener('popstate', fromHash);
addEventListener('resize', () => select(cur));

addEventListener('keydown', e => {
  if (inGame) { if (e.key === 'Escape') history.back(); return; }
  if (e.key === 'ArrowRight') select(cur + 1);
  else if (e.key === 'ArrowLeft') select(cur - 1);
  else if (e.key === 'Home') select(0);
  else if (e.key === 'End') select(GAMES.length - 1);
  else if (e.key === 'Enter' && document.activeElement !== $('play')) launch();
});
addEventListener('wheel', e => {
  if (inGame) return;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (Math.abs(d) > 12 && !wheel.lock) { select(cur + (d > 0 ? 1 : -1)); wheel.lock = true; setTimeout(() => wheel.lock = false, 180); }
}, { passive: true });
const wheel = { lock: false };

// свайп на телефоне
let sx = null;
addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
addEventListener('touchend', e => {
  if (sx === null || inGame) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 40) select(cur + (dx < 0 ? 1 : -1));
}, { passive: true });

// геймпад: крестовина или левый стик, кнопка A — играть, B — назад
let gpLock = 0;
(function pad() {
  const p = (navigator.getGamepads ? [...navigator.getGamepads()] : []).find(Boolean);
  if (p && performance.now() > gpLock) {
    const ax = p.axes[0] || 0, R = p.buttons[15]?.pressed || ax > .6, L = p.buttons[14]?.pressed || ax < -.6;
    if (!inGame && R) { select(cur + 1); gpLock = performance.now() + 200; }
    else if (!inGame && L) { select(cur - 1); gpLock = performance.now() + 200; }
    else if (!inGame && p.buttons[0]?.pressed) { launch(); gpLock = performance.now() + 400; }
    else if (inGame && p.buttons[1]?.pressed) { history.back(); gpLock = performance.now() + 400; }
  }
  requestAnimationFrame(pad);
})();

function tick() {
  $('clock').textContent = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}
tick(); setInterval(tick, 15000);

select(0);
fromHash();
</script>
</body>
</html>
